<button
  type="button"
  class="dashboard-nav-card"
  [attr.aria-label]="ariaLabel || label"
  (click)="pressed.emit()"
>
  <i *ngIf="icon" [class]="icon" class="dashboard-nav-card__icon" aria-hidden="true"></i>
  <span class="dashboard-nav-card__label">{{ label }}</span>
  <span
    *ngIf="hasBadge"
    class="dashboard-nav-card__badge"
    [ngClass]="'dashboard-nav-card__badge--' + badgeVariant"
  >
    {{ badge }}
  </span>
  <i class="ri-arrow-right-s-line dashboard-nav-card__arrow" aria-hidden="true"></i>
</button>
