<div class="page-shell">
  <app-page-header title="Documents de l'enfant" icon="ri-file-text-line">
    <ng-container page-header-actions *ngIf="enfants?.length">
      <div class="kid-picker">
        <i class="ri-user-smile-line kid-picker-icon" aria-hidden="true"></i>
        <select id="kidSelect"
                class="form-select kid-picker-select"
                [(ngModel)]="selectedKidId"
                (change)="onSelectKid()"
                aria-label="Sélectionner un enfant">
          <option [ngValue]="null" disabled selected hidden>Choisir un enfant…</option>
          <option *ngFor="let e of enfants" [value]="e.id">
            {{ e.prenom }} {{ e.nom }}<ng-container *ngIf="e.numeroLicence"> — #{{ e.numeroLicence }}</ng-container>
          </option>
        </select>
      </div>
    </ng-container>
  </app-page-header>

  <ui-kpi-grid [cols]="3">
    <ui-kpi-card icon="ri-file-list-3-line"     label="Documents requis" [value]="totalDocs"     tone="primary"></ui-kpi-card>
    <ui-kpi-card icon="ri-checkbox-circle-line" label="Validés"          [value]="docsValides"   tone="success"></ui-kpi-card>
    <ui-kpi-card icon="ri-time-line"            label="En attente"       [value]="docsEnAttente" [tone]="docsEnAttente > 0 ? 'warning' : 'neutral'"></ui-kpi-card>
  </ui-kpi-grid>

  <app-empty-state
    *ngIf="!enfants?.length"
    icon="ri-file-text-line"
    title="Aucun enfant lié à ce compte"
    description="Contactez l'administrateur pour associer un membre à votre compte.">
  </app-empty-state>

  <ng-container *ngIf="enfants?.length && selectedKidId">

    <!-- Barre de progression (une seule ligne, scrollable) -->
    <div class="docs-progress-bar" role="list" aria-label="Statut des documents obligatoires">
      <div class="progress-chip"
           role="listitem"
           *ngFor="let doc of requiredDocuments"
           [ngClass]="{
             'chip-success': getDocumentStatusInfo(doc.type).state === 'validé',
             'chip-warn':    getDocumentStatusInfo(doc.type).state === 'en_attente',
             'chip-danger':  getDocumentStatusInfo(doc.type).state === 'refusé'
           }">
        <i class="ri-check-circle-fill" *ngIf="getDocumentStatusInfo(doc.type).state === 'validé'"    aria-hidden="true"></i>
        <i class="ri-time-fill"          *ngIf="getDocumentStatusInfo(doc.type).state === 'en_attente'" aria-hidden="true"></i>
        <i class="ri-close-circle-fill"  *ngIf="getDocumentStatusInfo(doc.type).state === 'refusé'"     aria-hidden="true"></i>
        <span>{{ doc.label }}</span>
        <i *ngIf="getDocumentStatusInfo(doc.type).tooltip"
           class="tooltip-icon"
           [title]="getDocumentStatusInfo(doc.type).tooltip!"
           aria-label="Info">i</i>
      </div>
    </div>

    <!-- Card upload -->
    <div class="upload-card">
      <div class="upload-card-header">
        <div class="upload-card-icon">
          <i class="ri-upload-cloud-2-line" aria-hidden="true"></i>
        </div>
        <div>
          <h3>Ajouter un document</h3>
          <p>PDF, PNG ou JPEG · maximum 5 Mo</p>
        </div>
      </div>
      <div class="upload-card-body">
        <form (ngSubmit)="onUploadDocumentForKid()" enctype="multipart/form-data" novalidate class="upload-form">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="documentType">Type de document</label>
              <select id="documentType" class="form-select" [(ngModel)]="documentType" name="documentType" required>
                <option [ngValue]="null" disabled selected hidden>Sélectionnez un type</option>
                <option *ngFor="let doc of requiredDocuments" [value]="doc.type" [disabled]="doc.uploaded">
                  {{ doc.label }}
                </option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="documentFile">Fichier</label>
              <div class="upload-zone">
                <input id="documentFile" type="file"
                       (change)="onFileSelected($event)"
                       accept=".pdf,.png,.jpg,.jpeg" />
              </div>
              <small class="field-error" *ngIf="selectedFile && !isValidFile(selectedFile)">
                Fichier invalide — PNG, JPEG ou PDF, max 5 Mo.
              </small>
            </div>
          </div>
          <div class="form-actions">
            <ui-button
              type="submit"
              variant="primary"
              icon="ri-upload-2-line"
              label="Téléverser"
              [disabled]="!selectedKidId || !documentType || !selectedFile || !isValidFile(selectedFile)"
            />
          </div>
        </form>
      </div>
    </div>

    <!-- Tableau des documents -->
    <div class="docs-table-section">
      <h3 class="section-title">Documents envoyés</h3>
      <div class="table-wrap">
        <ui-table
          [columns]="tableColumns"
          [data]="rows"
          [actions]="tableActions"
          (actionClick)="onActionTable($event)">
        </ui-table>
      </div>
    </div>

  </ng-container>

  <!-- Invite à choisir un enfant si aucun sélectionné -->
  <div class="no-selection" *ngIf="enfants?.length && !selectedKidId">
    <i class="ri-user-smile-line" aria-hidden="true"></i>
    <p>Sélectionnez un enfant pour consulter ses documents</p>
  </div>

</div>

<ui-modal [open]="!!previewing" (closed)="closePreview()" [title]="previewing?.nomDocument || 'Aperçu'" size="xl">
  <ng-container *ngIf="previewing && isImage(previewing.nomDocument); else pdfBlock2">
    <img [attr.src]="previewing.cheminFichier ? rawUrl(previewing.cheminFichier) : null"
         alt="Aperçu du document"
         class="preview-img" />
  </ng-container>
  <ng-template #pdfBlock2>
    <object *ngIf="previewing"
            [data]="getSafeUrl(previewing.cheminFichier)"
            type="application/pdf"
            width="100%"
            height="600">
      <p>Impossible d'afficher le PDF.
        <a [href]="rawUrl(previewing.cheminFichier)" target="_blank" rel="noopener">Ouvrir dans un onglet</a>
      </p>
    </object>
  </ng-template>
</ui-modal>
