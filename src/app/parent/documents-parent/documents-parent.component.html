<div class="page-shell">
  <app-page-header title="Documents de l'enfant" icon="ri-file-text-line"></app-page-header>

  <app-empty-state
    *ngIf="!enfants?.length"
    icon="ri-file-text-line"
    title="Aucun enfant lié à ce compte"
    description="Contactez l'administrateur pour associer un membre à votre compte.">
  </app-empty-state>

  <ng-container *ngIf="enfants?.length">
    <div class="filters-bar">
      <select id="kidSelect" class="form-select" [(ngModel)]="selectedKidId" (change)="onSelectKid()">
        <option [ngValue]="null" disabled selected hidden>Sélectionnez un enfant</option>
        <option *ngFor="let e of enfants" [value]="e.id">
          {{ e.prenom }} {{ e.nom }}<ng-container *ngIf="e.numeroLicence"> — #{{ e.numeroLicence }}</ng-container>
        </option>
      </select>
    </div>

    <div class="documents-grid" *ngIf="selectedKidId">
      <!-- Documents obligatoires -->
      <div class="card">
        <div class="card-header">
          <h3>Documents obligatoires</h3>
        </div>
        <div class="card-body">
          <p class="section-desc">Ces documents sont nécessaires pour valider l'inscription.</p>
          <ul class="required-list">
            <li *ngFor="let doc of requiredDocuments">
              <span>{{ doc.label }}</span>
              <ng-container *ngIf="getDocumentStatusInfo(doc.type) as statusInfo">
                <span class="status-badge"
                      [class.status--success]="statusInfo.state === 'validé'"
                      [class.status--warning]="statusInfo.state === 'en_attente'"
                      [class.status--danger]="statusInfo.state === 'refusé'">
                  <i class="ri-check-line" *ngIf="statusInfo.state === 'validé'"></i>
                  <i class="ri-time-line" *ngIf="statusInfo.state === 'en_attente'"></i>
                  <i class="ri-close-line" *ngIf="statusInfo.state === 'refusé'"></i>
                  {{ statusInfo.text }}
                  <i *ngIf="statusInfo.tooltip" class="tooltip-icon" [title]="statusInfo.tooltip">i</i>
                </span>
              </ng-container>
            </li>
          </ul>
        </div>
      </div>

      <!-- Upload -->
      <div class="card">
        <div class="card-header">
          <h3>Ajouter un document</h3>
        </div>
        <div class="card-body">
          <p class="section-desc">Sélectionnez le type et téléversez le fichier pour l'enfant choisi.</p>
          <form (ngSubmit)="onUploadDocumentForKid()" enctype="multipart/form-data" novalidate>
            <div class="form-group">
              <label class="form-label" for="documentType">Type de document</label>
              <select id="documentType" class="form-select" [(ngModel)]="documentType" name="documentType" required>
                <option [ngValue]="null" disabled selected hidden>Sélectionnez un document</option>
                <option *ngFor="let doc of requiredDocuments" [value]="doc.type" [disabled]="doc.uploaded">
                  {{ doc.label }}
                </option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="documentFile">Fichier</label>
              <div class="upload-zone">
                <input id="documentFile" type="file"
                       (change)="onFileSelected($event)"
                       accept=".pdf,.png,.jpg,.jpeg"
                       required />
              </div>
              <small class="field-error" *ngIf="selectedFile && !isValidFile(selectedFile)">
                Type ou taille invalide. PNG, JPEG ou PDF, max 5 Mo.
              </small>
            </div>
            <button type="submit" class="btn btn-primary"
                    [disabled]="!selectedKidId || !documentType || !selectedFile || !isValidFile(selectedFile)">
              <i class="ri-upload-2-line"></i> Téléverser
            </button>
          </form>
        </div>
      </div>

      <!-- Liste des documents -->
      <div class="documents-list">
        <h3 class="list-title">Documents de l'enfant</h3>
        <div class="table-wrap">
          <ui-table
            [columns]="tableColumns"
            [data]="rows"
            [actions]="tableActions"
            (actionClick)="onActionTable($event)">
          </ui-table>
        </div>
      </div>
    </div>
  </ng-container>
</div>

<ui-modal [open]="!!previewing" (closed)="closePreview()" [title]="previewing?.nomDocument || 'Aperçu'" size="xl">
  <ng-container *ngIf="previewing && isImage(previewing.nomDocument); else pdfBlock2">
    <img [attr.src]="previewing.cheminFichier ? rawUrl(previewing.cheminFichier) : null"
         alt="Aperçu image"
         class="preview-img" />
  </ng-container>
  <ng-template #pdfBlock2>
    <object *ngIf="previewing"
            [data]="getSafeUrl(previewing.cheminFichier)"
            type="application/pdf"
            width="100%"
            height="600">
      <p>Impossible d'afficher le PDF.</p>
    </object>
  </ng-template>
</ui-modal>
