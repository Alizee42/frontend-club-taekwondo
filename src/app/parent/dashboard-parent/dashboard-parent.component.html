<div class="dashboard-container">
  <!-- En-tête -->
  <header class="dashboard-header">
  <h1 class="page-title">Tableau de bord Parent</h1>
    <div class="welcome-message">Bienvenue, <span class="highlight">{{ utilisateurConnecte?.prenom }} {{ utilisateurConnecte?.nom }}</span></div>
  </header>

  <p class="intro">
    Depuis cet espace, vous pouvez gérer les paiements de vos enfants, déposer des documents et commander des tenues.
  </p>

  <!-- Cartes de navigation refactorisées -->
  <section class="dashboard-grid" aria-labelledby="actions-parent">
    <h2 id="actions-parent" class="visually-hidden">Actions parent</h2>
    <app-dashboard-card
      icon="ri-wallet-3-line"
      title="Mes Paiements"
      description="Gérez les paiements enfants."
      [badge]="stats.paiementsEnRetard"
      (action)="navigateToPaiements()">
    </app-dashboard-card>
    <app-dashboard-card
      icon="ri-folder-upload-line"
      title="Documents"
      description="Certificat médical, autorisations."
      [badge]="stats.documentsManquants"
      (action)="navigateToDocuments()">
    </app-dashboard-card>
    <app-dashboard-card
      icon="ri-shopping-bag-line"
      title="Mes Commandes"
      description="Historique & suivi."
      [badge]="stats.commandesEnCours"
      (action)="navigateToCommandes()">
    </app-dashboard-card>
    <app-dashboard-card
      icon="ri-calendar-event-line"
      title="Événements"
      description="Inscriptions & stages."
      [badge]="stats.evenementsAVenir"
      (action)="navigateToEvenements()">
    </app-dashboard-card>
  </section>
</div>
