<div class="page-shell">
  <app-page-header title="Galerie du club" icon="ri-gallery-line">
    <ng-container page-header-actions>
      <ui-button label="Ajouter une photo" variant="primary" (clicked)="openAddModal()"></ui-button>
    </ng-container>
  </app-page-header>
  <div class="table-wrap">
    <ui-table [columns]="tableColumns" [data]="images" [actions]="tableActions" (actionClick)="handleTableAction($event)"></ui-table>
  </div>
</div>

<ui-modal [open]="modalOpen" [title]="modalTitle" (closed)="closeModal()" [stickyFooter]="true" size="sm">
  <form #galerieNgForm="ngForm" novalidate>
    <div class="form-group">
      <label for="titre">Titre <span class="required-mark">*</span></label>
      <input id="titre" type="text" [(ngModel)]="formImage.titre" name="titre" required />
    </div>
    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description" [(ngModel)]="formImage.description" name="description" rows="3"></textarea>
    </div>
    <div class="form-group">
      <label for="imageFile">Image</label>
      <input id="imageFile" type="file" #imageFileInput (change)="onFileSelected($event)" accept="image/*" />
      <img *ngIf="formImage.imageUrl" [src]="formImage.imageUrl" alt="Aperçu" class="upload-preview" />
    </div>
  </form>

  <div modal-footer>
    <ui-button type="button" variant="ghost" label="Annuler" (clicked)="closeModal()"></ui-button>
    <ui-button [label]="editMode ? 'Modifier' : 'Enregistrer'" type="button" variant="primary" icon="ri-save-line" [disabled]="isSubmitting" (clicked)="submitImage()"></ui-button>
  </div>
</ui-modal>
