<div class="page-shell">
  <app-page-header title="Utilisateurs du club" icon="ri-user-line">
    <ng-container page-header-actions>
      <ui-button label="Ajouter" icon="ri-user-add-line" variant="primary" (clicked)="openAddModal()"></ui-button>
    </ng-container>
  </app-page-header>
  <div class="table-wrap">
    <ui-table
      [columns]="columns"
      [data]="utilisateurs"
      [actions]="actions"
      (actionClick)="onActionClick($event)">
    </ui-table>
  </div>
</div>

<ui-modal [open]="modalOpen" [title]="modalTitle" (closed)="closeModal()">
  <form *ngIf="utilisateurEdit" class="utilisateur-form" (submit)="$event.preventDefault()">
    <div class="form-group">
      <label>Nom</label>
      <input type="text" [(ngModel)]="utilisateurEdit.nom" name="nom" required />
    </div>
    <div class="form-group">
      <label>Prénom</label>
      <input type="text" [(ngModel)]="utilisateurEdit.prenom" name="prenom" required />
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="utilisateurEdit.email" name="email" required />
    </div>
    <div class="form-group">
      <label>Rôle</label>
      <select [(ngModel)]="utilisateurEdit.role" name="role" required>
        <option value="">Sélectionner un rôle</option>
        <option value="MEMBRE">MEMBRE</option>
        <option value="PARENT">PARENT</option>
      </select>
    </div>
    <div class="modal-footer">
      <ui-button label="Annuler" variant="ghost" type="button" (clicked)="closeModal()"></ui-button>
      <ui-button label="Valider" variant="primary" type="submit"
        [disabled]="!utilisateurEdit.nom || !utilisateurEdit.prenom || !utilisateurEdit.email || !utilisateurEdit.role">
      </ui-button>
    </div>
  </form>
</ui-modal>
