
<div class="gestion-utilisateurs">
  <div class="header-utilisateurs">
    <h2 class="page-title">Utilisateurs du club</h2>
    <button class="btn-add" title="Ajouter un utilisateur" (click)="openAddModal()">
      <i class="ri-user-add-line"></i> Ajouter
    </button>
  <ui-modal [open]="modalOpen" [title]="modalTitle" (closed)="closeModal()">
    <form *ngIf="utilisateurEdit" class="utilisateur-form" (submit)="$event.preventDefault()">
      <h3>{{ modalTitle }}</h3>
      <div class="form-group">
        <label>Nom</label>
        <input type="text" [(ngModel)]="utilisateurEdit.nom" name="nom" required />
      </div>
      <div class="form-group">
        <label>Prénom</label>
        <input type="text" [(ngModel)]="utilisateurEdit.prenom" name="prenom" required />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="utilisateurEdit.email" name="email" required />
      </div>
      <div class="form-group">
        <label>Rôle</label>
        <select [(ngModel)]="utilisateurEdit.role" name="role" required>
          <option value="">Sélectionner un rôle</option>
          <option value="MEMBRE">MEMBRE</option>
          <option value="PARENT">PARENT</option>
        </select>
      </div>
      <div class="form-actions">
        <button type="submit" [disabled]="!utilisateurEdit.nom || !utilisateurEdit.prenom || !utilisateurEdit.email || !utilisateurEdit.role">Valider</button>
        <button type="button" (click)="closeModal()">Annuler</button>
      </div>
    </form>
  </ui-modal>
  </div>
  <div class="table-wrapper">
    <ui-table
      [columns]="columns"
      [data]="utilisateurs"
      [actions]="actions"
      (actionClick)="onActionClick($event)">
    </ui-table>
  </div>
</div>
