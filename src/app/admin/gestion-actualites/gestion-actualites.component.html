<div class="gestion-actualites-container">
  <div class="header-flex">
    <ui-title text="Gestion des Actualités" [level]="2" align="left"></ui-title>
    <ui-button label="Nouvelle actualité" icon="ri-add-line" (clicked)="openModal()" variant="primary"></ui-button>
  </div>
  <div class="table-toolbar">
    <div style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
      <ui-search-filter [placeholder]="'Rechercher...'" [value]="searchTerm" (valueChange)="searchTerm = $event"></ui-search-filter>
      <select [(ngModel)]="typeFilter" name="typeFilter" style="padding: 0.3rem 0.7rem; border-radius: 6px; border: 1px solid #e0e0e0; background: #f5f5f5;">
        <option value="">Tous types</option>
        <option value="evenement">Événement</option>
        <option value="competition">Compétition</option>
        <option value="annonce">Annonce</option>
      </select>
      <label style="display: flex; align-items: center; gap: 0.3rem; font-size: 0.98em; cursor: pointer;">
        <input type="checkbox" [(ngModel)]="featuredOnly" name="featuredOnly" style="margin:0;" />
        À la une seulement
      </label>
    </div>
  </div>
  <ui-table
    [columns]="columns"
    [data]="filteredActualites()"
    [actions]="actions"
    (actionClick)="onTableAction($event)"
  ></ui-table>
  <ui-modal [open]="isModalOpen" [title]="actualite.id ? 'Modifier une actualité' : 'Nouvelle actualité'" (closed)="closeModal()">
    <form (ngSubmit)="onSubmit()" #actualiteForm="ngForm" class="modal-form">
      <div class="form-group">
        <label for="titre">Titre</label>
        <input type="text" id="titre" [(ngModel)]="actualite.titre" name="titre" required />
      </div>
      <div class="form-group">
        <label for="typeActu">Type</label>
        <select id="typeActu" [(ngModel)]="actualite.typeActu" name="typeActu" required>
          <option value="evenement">Événement</option>
          <option value="competition">Compétition</option>
          <option value="annonce">Annonce</option>
        </select>
      </div>
      <div class="form-group">
        <label for="contenu">Contenu</label>
        <textarea id="contenu" [(ngModel)]="actualite.contenu" name="contenu" required></textarea>
      </div>
      <div class="form-group">
        <label for="image">Image</label>
        <input type="file" id="image" (change)="onImageSelected($event)" />
        <div class="image-preview" *ngIf="imageUrl">
          <img [src]="imageUrl" alt="Prévisualisation" />
        </div>
      </div>
      <div class="form-featured">
        <label class="switch">
          <input type="checkbox" [(ngModel)]="actualite.isFeatured" name="isFeatured" />
          <span class="slider round"></span>
        </label>
        <div>
          <strong>Mettre cette actualité à la une</strong>
          <p>Elle sera affichée en première position sur le site.</p>
        </div>
      </div>
      <div class="modal-actions">
        <ui-button type="submit" [label]="actualite.id ? 'Mettre à jour' : 'Ajouter'" variant="primary"></ui-button>
        <ui-button type="button" label="Annuler" variant="secondary" (clicked)="closeModal()"></ui-button>
      </div>
    </form>
  </ui-modal>
</div>
