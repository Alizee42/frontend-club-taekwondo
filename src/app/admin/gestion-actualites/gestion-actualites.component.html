<div class="page-shell">
  <app-page-header
    title="Gestion des actualites"
    icon="ri-newspaper-line"
    subtitle="Publier, modifier et mettre en avant les actualites du club"
  >
    <ng-container page-header-actions>
      <ui-button
        label="Ajouter une actualite"
        icon="ri-add-line"
        variant="primary"
        (clicked)="openModal()"
      ></ui-button>
    </ng-container>
  </app-page-header>

  <ui-kpi-grid [cols]="3">
    <ui-kpi-card icon="ri-newspaper-line"  label="Actualités"   [value]="nbActualites" tone="primary"></ui-kpi-card>
    <ui-kpi-card icon="ri-star-line"       label="À la une"     [value]="nbALaUne"     tone="amber"></ui-kpi-card>
    <ui-kpi-card icon="ri-calendar-line"   label="Événements"   [value]="nbEvenements" tone="purple"></ui-kpi-card>
  </ui-kpi-grid>

  <div class="filters-bar">
    <input
      type="text"
      class="form-input"
      placeholder="Rechercher une actualite..."
      [(ngModel)]="searchTerm"
      name="searchTerm"
    />

    <select class="form-select" [(ngModel)]="typeFilter" name="typeFilter">
      <option value="">Tous les types</option>
      <option *ngFor="let option of typeOptions" [value]="option.value">{{ option.label }}</option>
    </select>

    <label class="filters-check ms-auto">
      <input type="checkbox" [(ngModel)]="featuredOnly" name="featuredOnly" />
      A la une uniquement
    </label>
  </div>

  <div class="table-wrap">
    <ui-table
      [columns]="columns"
      [data]="filteredActualites()"
      [actions]="actions"
      (actionClick)="onTableAction($event)"
    ></ui-table>
  </div>
</div>

<ui-modal
  [open]="isModalOpen"
  [title]="actualite.id ? 'Modifier une actualite' : 'Nouvelle actualite'"
  (closed)="closeModal()"
>
  <form class="actualite-form" #actualiteForm="ngForm" (ngSubmit)="onSubmit()">
    <div class="form-grid">
      <div class="form-group form-group--full">
        <label for="titre">Titre</label>
        <input id="titre" type="text" [(ngModel)]="actualite.titre" name="titre" required />
      </div>

      <div class="form-group">
        <label for="typeActu">Type</label>
        <select id="typeActu" [(ngModel)]="actualite.typeActu" name="typeActu" required>
          <option value="" disabled>Selectionner un type</option>
          <option *ngFor="let option of typeOptions" [value]="option.value">{{ option.label }}</option>
        </select>
      </div>

      <div class="form-group">
        <label for="datePublication">Date de publication</label>
        <input
          id="datePublication"
          type="text"
          [ngModel]="actualite.datePublication | date: 'dd/MM/yyyy'"
          name="datePublicationDisplay"
          disabled
        />
      </div>

      <div class="form-group form-group--full">
        <label for="contenu">Contenu</label>
        <textarea id="contenu" [(ngModel)]="actualite.contenu" name="contenu" required></textarea>
      </div>

      <div class="form-group form-group--full">
        <label for="image">Image</label>
        <input id="image" type="file" accept="image/*" (change)="onImageSelected($event)" />
        <p *ngIf="imageError" class="form-error">{{ imageError }}</p>
      </div>

      <div class="form-group form-group--full image-preview" *ngIf="imageUrl">
        <label>Apercu</label>
        <img [src]="imageUrl" alt="Apercu de l'image" />
      </div>
    </div>

    <div class="featured-toggle">
      <input id="isFeatured" type="checkbox" [(ngModel)]="actualite.isFeatured" name="isFeatured" />
      <div class="featured-toggle-copy">
        <label for="isFeatured">Mettre cette actualite a la une</label>
        <p>Elle sera mise en avant sur le site du club.</p>
      </div>
    </div>

    <div class="modal-footer">
      <ui-button label="Annuler" variant="ghost" type="button" (clicked)="closeModal()"></ui-button>
      <ui-button
        [label]="actualite.id ? 'Mettre a jour' : 'Ajouter'"
        variant="primary"
        type="submit"
        [disabled]="!!actualiteForm.invalid"
      ></ui-button>
    </div>
  </form>
</ui-modal>
