<div class="page-shell">
  <app-page-header
    title="Gestion des paiements"
    icon="ri-wallet-3-line"
    subtitle="Suivre les encaissements, les echeances et ajouter un nouveau paiement"
  >
    <ng-container page-header-actions>
      <ui-button
        label="Ajouter un paiement"
        icon="ri-add-line"
        (clicked)="ouvrirModalAjout()"
      ></ui-button>
      <ui-button
        label="Rafraichir"
        icon="ri-refresh-line"
        variant="secondary"
        (clicked)="refreshStats(); loadPaiements()"
      ></ui-button>
    </ng-container>
  </app-page-header>

  <section class="stats-grid">
    <article class="stat-card stat-card--success">
      <div class="stat-icon"><i class="ri-wallet-3-line" aria-hidden="true"></i></div>
      <div class="stat-copy">
        <span class="stat-label">Total encaisse</span>
        <strong class="stat-value">{{ stats.totalPayes | currency:'EUR' }}</strong>
      </div>
    </article>

    <article class="stat-card stat-card--warning">
      <div class="stat-icon"><i class="ri-time-line" aria-hidden="true"></i></div>
      <div class="stat-copy">
        <span class="stat-label">En attente</span>
        <strong class="stat-value">{{ stats.totalAttente | currency:'EUR' }}</strong>
      </div>
    </article>

    <article class="stat-card stat-card--danger">
      <div class="stat-icon"><i class="ri-close-circle-line" aria-hidden="true"></i></div>
      <div class="stat-copy">
        <span class="stat-label">Annules</span>
        <strong class="stat-value">{{ stats.totalAnnules | currency:'EUR' }}</strong>
      </div>
    </article>

    <article class="stat-card stat-card--neutral">
      <div class="stat-icon"><i class="ri-bar-chart-2-line" aria-hidden="true"></i></div>
      <div class="stat-copy">
        <span class="stat-label">Payes ce mois</span>
        <strong class="stat-value">{{ stats.pourcentagePayesMois | number:'1.0-1' }}%</strong>
      </div>
    </article>
  </section>

  <section class="summary-strip">
    <span class="summary-pill">
      <i class="ri-bank-card-line" aria-hidden="true"></i>
      {{ totalPaiements }} paiement(s)
    </span>
    <span class="summary-pill summary-pill--danger">
      <i class="ri-alert-line" aria-hidden="true"></i>
      {{ nbRetards }} membre(s) en retard
    </span>
  </section>

  <div class="tabs-card">
    <nav class="tabs-nav" aria-label="Navigation des paiements">
      <button
        type="button"
        class="tab-button"
        [class.active]="ongletActif === 'paiements'"
        (click)="changerOnglet('paiements')"
      >
        <i class="ri-money-euro-circle-line" aria-hidden="true"></i>
        <span>Paiements</span>
      </button>

      <button
        type="button"
        class="tab-button"
        [class.active]="ongletActif === 'echeances'"
        (click)="changerOnglet('echeances')"
      >
        <i class="ri-calendar-check-line" aria-hidden="true"></i>
        <span>Echeances</span>
      </button>
    </nav>

    <section class="tab-panel">
      <app-suivi-paiements
        *ngIf="ongletActif === 'paiements'"
        [paiementsData]="paiements"
        [viewMode]="'paiements'"
      ></app-suivi-paiements>

      <app-echeance
        *ngIf="ongletActif === 'echeances'"
        [echeances]="getAllEcheances()"
        [inline]="true"
      ></app-echeance>
    </section>
  </div>
</div>

<ui-modal
  [open]="modalAjoutVisible"
  title="Ajouter un paiement"
  (closed)="fermerModalAjout()"
>
  <div class="payment-modal-content">
    <app-ajout-paiement (paiementAjoute)="onPaiementAjoute()"></app-ajout-paiement>
  </div>
</ui-modal>
