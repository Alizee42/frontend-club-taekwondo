<div class="admin-container">
  <!-- Sidebar -->
  <aside class="sidebar">
    <h2>💼 Paiements Admin</h2>
    <ul class="menu">
      <li (click)="changerVue('dashboard')" [class.active]="vueActive === 'dashboard'">🏠 Dashboard</li>
      <li (click)="changerVue('utilisateurs')" [class.active]="vueActive === 'utilisateurs'">👥 Membres</li>
      <li (click)="changerVue('paiements')" [class.active]="vueActive === 'paiements'">💰 Paiements</li>
      <li (click)="changerVue('echeances')" [class.active]="vueActive === 'echeances'">📅 Échéances</li>
      <li (click)="changerVue('ajouter-paiement')" [class.active]="vueActive === 'ajouter-paiement'">➕ Ajouter</li>
      <li (click)="changerVue('historique')" [class.active]="vueActive === 'historique'">📜 Historique</li>
      <li (click)="changerVue('parametres')" [class.active]="vueActive === 'parametres'">⚙️ Paramètres</li>
    </ul>
  </aside>

  <!-- Contenu -->
  <main class="content">
    <ng-container [ngSwitch]="vueActive">
      <section *ngSwitchCase="'dashboard'"><app-dashboard-paiement></app-dashboard-paiement></section>
      <section *ngSwitchCase="'utilisateurs'"><app-utilisateurs-paiement></app-utilisateurs-paiement></section>
      <section *ngSwitchCase="'paiements'"><app-suivi-paiements></app-suivi-paiements></section>
      <section *ngSwitchCase="'echeances'"><app-echeances></app-echeances></section>
      <section *ngSwitchCase="'ajouter-paiement'"><app-ajout-paiement></app-ajout-paiement></section>
      <section *ngSwitchCase="'historique'"><app-historique-paiements></app-historique-paiements></section>
      <section *ngSwitchCase="'parametres'"><app-parametres-paiement></app-parametres-paiement></section>
      <section *ngSwitchDefault><p>Choisissez une vue dans le menu.</p></section>
    </ng-container>
  </main>
</div>
