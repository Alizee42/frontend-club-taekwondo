<div class="gestion-paiements-modern">
  <!-- Header avec titre -->
  <header class="page-header">
    <ui-title [level]="2" text="Gestion des Paiements"></ui-title>
  </header>

  <!-- Stats KPI (compactes) -->
  <section class="kpi-section">
    <div class="kpi-card success">
      <i class="ri-wallet-3-line"></i>
      <div class="kpi-content">
        <span class="kpi-label">Total encaissé</span>
        <span class="kpi-value">{{ stats.totalPayes | currency:'EUR' }}</span>
      </div>
    </div>
    <div class="kpi-card warning">
      <i class="ri-time-line"></i>
      <div class="kpi-content">
        <span class="kpi-label">En attente</span>
        <span class="kpi-value">{{ stats.totalAttente | currency:'EUR' }}</span>
      </div>
    </div>
    <div class="kpi-card danger">
      <i class="ri-close-circle-line"></i>
      <div class="kpi-content">
        <span class="kpi-label">Annulés</span>
        <span class="kpi-value">{{ stats.totalAnnules | currency:'EUR' }}</span>
      </div>
    </div>
    <div class="kpi-card neutral">
      <i class="ri-bar-chart-2-line"></i>
      <div class="kpi-content">
        <span class="kpi-label">% payés ce mois</span>
        <span class="kpi-value">{{ stats.pourcentagePayesMois | number:'1.0-1' }}%</span>
      </div>
    </div>
  </section>

  <!-- Onglets -->
  <nav class="tabs-nav">
    <button 
      class="tab-button" 
      [class.active]="ongletActif === 'paiements'"
      (click)="changerOnglet('paiements')">
      <i class="ri-money-euro-circle-line"></i> Paiements
    </button>
    <button 
      class="tab-button" 
      [class.active]="ongletActif === 'echeances'"
      (click)="changerOnglet('echeances')">
      <i class="ri-calendar-check-line"></i> Échéances
    </button>
  </nav>

  <!-- Contenu des onglets -->
  <section class="tab-content">
    <app-suivi-paiements *ngIf="ongletActif === 'paiements'"></app-suivi-paiements>
    <div *ngIf="ongletActif === 'echeances'" class="suivi">
      <h2 class="page-title"><i class="ri-calendar-check-line"></i> Échéances</h2>
      <div class="table-wrapper" *ngIf="paiements.length">
        <ui-table
          [columns]="echeancesColumns"
          [data]="paiements"
          [actions]="echeancesActions"
          (actionClick)="onEcheanceAction($event)"
        ></ui-table>
      </div>
      <div class="empty" *ngIf="!paiements.length">Aucun paiement trouvé.</div>
    </div>
  </section>


  <!-- Modal d'ajout (si visible) -->
  <div class="modal-overlay" *ngIf="modalAjoutVisible" (click)="fermerModalAjout()">
    <div class="modal-container" (click)="$event.stopPropagation()">
      <button class="modal-close" (click)="fermerModalAjout()">
        <i class="ri-close-line"></i>
      </button>
      <app-ajout-paiement (paiementAjoute)="onPaiementAjoute()"></app-ajout-paiement>
    </div>
  </div>
</div>
