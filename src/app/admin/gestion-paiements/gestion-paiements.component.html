<div class="admin-container">
  <!-- Sidebar -->
  <aside class="sidebar">
    <h2>💼 Paiements Admin</h2>
    <ul class="menu">
      <li (click)="changerVue('dashboard')" [class.active]="vueActive === 'dashboard'">🏠 Tableau de bord</li>
      <li (click)="changerVue('paiements')" [class.active]="vueActive === 'paiements'">💰 Paiements</li>
      <li (click)="changerVue('echeances')" [class.active]="vueActive === 'echeances'">📅 Échéances</li>
      <li (click)="changerVue('ajouter-paiement')" [class.active]="vueActive === 'ajouter-paiement'">➕ Ajouter</li>
      <li (click)="changerVue('parametres')" [class.active]="vueActive === 'parametres'">⚙️ Paramètres</li>
    </ul>
  </aside>

  <!-- Contenu -->
  <main class="content">
    <ng-container [ngSwitch]="vueActive">
      <section *ngSwitchCase="'dashboard'">
        <app-dashboard-paiement></app-dashboard-paiement>
      </section>

      <section *ngSwitchCase="'paiements'">
        <app-suivi-paiements (changementVue)="changerVue('paiements')"></app-suivi-paiements>
      </section>

      <section *ngSwitchCase="'echeances'">
        <app-echeances></app-echeances>
      </section>

<section *ngSwitchCase="'ajouter-paiement'">
  <app-ajout-paiement (changementVue)="changerVue($event)"></app-ajout-paiement>
</section>


    

      <section *ngSwitchCase="'parametres'">
        <app-parametres-paiement></app-parametres-paiement>
      </section>

      <section *ngSwitchDefault>
        <p>Choisissez une vue dans le menu.</p>
      </section>
    </ng-container>
  </main>
</div>
