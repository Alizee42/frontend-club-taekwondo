<div class="gestion-horaires-admin">
  <div class="header-horaires-admin">
    <h2 class="titre-section">
      <i class="ri-time-line"></i> Gestion des horaires
    </h2>
    <button class="btn btn-primary creation-btn-header" (click)="openModal()">
      <i class="ri-add-line"></i> Ajouter un horaire
    </button>
  </div>

  <div class="horaire-list">
    <div *ngFor="let horaire of horaires; let i = index" class="horaire-card">
      <div class="horaire-jour-titre">
        {{ horaire.jour }}
      </div>
      <div class="horaire-info-row">
        <span class="horaire-info-row-label"><i class="ri-time-line"></i> Heure :</span>
        <span class="horaire-info-row-value">{{ horaire.heures[0]?.time }}</span>
      </div>
      <div class="horaire-info-row">
        <span class="horaire-info-row-label"><i class="ri-group-line"></i> Groupe :</span>
        <span class="horaire-info-row-value">{{ horaire.heures[0]?.groupe }}</span>
      </div>
      <div class="horaire-info-row">
        <span class="horaire-info-row-label"><i class="ri-map-pin-line"></i> Adresse :</span>
        <span class="horaire-info-row-value">
          <span>{{ horaire.adresse }}</span>
          <span class="horaire-adresse-ligne2" *ngIf="horaire.codePostal || horaire.ville">{{ horaire.codePostal }}<span *ngIf="horaire.codePostal && horaire.ville">, </span>{{ horaire.ville }}</span>
        </span>
      </div>
      <button class="btn-action-icon btn-delete" (click)="deleteHoraire(i)" title="Supprimer">
        <i class="ri-delete-bin-7-line"></i>
        <span class="visually-hidden">Supprimer</span>
      </button>
    </div>
  </div>

  <!-- Modale moderne -->
  <div class="modal-backdrop" *ngIf="showModal">
    <div class="modal">
      <div class="modal-header">
        <h5>Ajouter un horaire</h5>
        <button class="close-btn" (click)="closeModal()">✖</button>
      </div>
      <div class="modal-body">
        <form>
          <div class="form-group">
            <label for="jour">Jour</label>
            <select id="jour" [(ngModel)]="newHoraire.jour" name="jour" required>
              <option value="" disabled selected>Choisir un jour</option>
              <option *ngFor="let jour of joursSemaine" [value]="jour">{{ jour }}</option>
            </select>
          </div>
          <div class="form-group">
            <label for="heures">Tranche horaire</label>
            <select id="heures" [(ngModel)]="newHoraire.heures" name="heures" required>
              <option value="" disabled selected>Choisir une tranche horaire</option>
              <option *ngFor="let tranche of tranchesHoraires" [value]="tranche">{{ tranche }}</option>
            </select>
          </div>
          <div class="form-group">
            <label for="groupe">Groupe</label>
            <input type="text" id="groupe" [(ngModel)]="newHoraire.groupe" name="groupe" placeholder="Ex : Enfants, Adultes">
          </div>
          <div class="form-group">
            <label for="adresse">Adresse</label>
            <input type="text" id="adresse" [(ngModel)]="newHoraire.adresse" name="adresse" placeholder="Ex : 16 Rue du Progrès" required>
          </div>
          <div class="form-group">
            <label for="codePostal">Code postal</label>
            <input type="text" id="codePostal" [(ngModel)]="newHoraire.codePostal" name="codePostal" placeholder="Ex : 75000" required>
          </div>
          <div class="form-group">
            <label for="ville">Ville</label>
            <input type="text" id="ville" [(ngModel)]="newHoraire.ville" name="ville" placeholder="Ex : Paris" required>
          </div>
          <button class="btn btn-success mt-3" style="float:right;" (click)="addHoraire()">Ajouter</button>
        </form>
      </div>
    </div>
  </div>
</div>
