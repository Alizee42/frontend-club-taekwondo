<div class="page-shell">
  <app-page-header title="Gestion des produits" icon="ri-price-tag-3-line" subtitle="Ajoutez et gérez les produits disponibles dans la boutique du club.">
    <ng-container page-header-actions>
      @if (isClubLocked) {
        <span class="club-chip">
          <i class="ri-building-4-line"></i>
          {{ selectedClubName || '…' }}
        </span>
      } @else {
        <span class="club-picker-inline">
          <span class="club-picker-inline__label">Club</span>
          <select class="form-select" [ngModel]="selectedClubId" (ngModelChange)="onSelectClub($event)">
            <option [ngValue]="null">Choisir un club…</option>
            @for (c of clubs; track c.id) {
              <option [ngValue]="c.id">{{ c.nom || c.name }}</option>
            }
          </select>
        </span>
      }
      <ui-button
        variant="primary"
        icon="ri-add-line"
        label="Nouveau produit"
        [disabled]="!selectedClubId"
        (clicked)="ouvrirAjout()">
      </ui-button>
    </ng-container>
  </app-page-header>

  <ui-kpi-grid [cols]="3">
    <ui-kpi-card icon="ri-price-tag-3-line" label="Produits"   [value]="nbProduits" tone="primary" [loading]="loading"></ui-kpi-card>
    <ui-kpi-card icon="ri-checkbox-circle-line" label="En stock" [value]="nbEnStock" tone="success" [loading]="loading"></ui-kpi-card>
    <ui-kpi-card icon="ri-error-warning-line" label="En rupture" [value]="nbRupture" [tone]="nbRupture > 0 ? 'danger' : 'neutral'" [loading]="loading"></ui-kpi-card>
  </ui-kpi-grid>

  <div *ngIf="selectedClubId; else noClubSelected">

    <!-- Barre de recherche -->
    <div class="search-bar">
      <input
        type="text"
        placeholder="Rechercher un produit…"
        [(ngModel)]="search"
        (ngModelChange)="filtrer()"
        aria-label="Rechercher un produit" />
      <span class="result-count">{{ filtered.length }} produit(s)</span>
    </div>

    <div *ngIf="!loading && error" class="error-msg">{{ error }}</div>

    <div class="table-wrap">
      <ui-table [columns]="tableColumns" [data]="filtered" [actions]="tableActions" (actionClick)="handleTableAction($event)"></ui-table>
    </div>

  </div>

  <ng-template #noClubSelected>
    <p class="empty-hint">Choisis un club ci-dessus pour afficher et gérer ses produits.</p>
  </ng-template>
</div>

<ui-modal [open]="modalOpen" [title]="modalMode === 'add' ? 'Nouveau produit' : 'Modifier le produit'" (closed)="fermerModal()">
  <form (ngSubmit)="sauvegarder()">
    <div class="form-group">
      <label for="f-nom">Nom</label>
      <input id="f-nom" type="text" [(ngModel)]="form.nom" name="nom" placeholder="Ex : Dobok Taekwondo" required />
    </div>

    <div class="form-group">
      <label for="f-categorie">Catégorie</label>
      <select id="f-categorie" [(ngModel)]="form.categorie" name="categorie">
        <option *ngFor="let c of categories" [value]="c">{{ c }}</option>
      </select>
    </div>

    <div class="form-group">
      <label for="f-desc">Description</label>
      <textarea id="f-desc" [(ngModel)]="form.description" name="description" rows="3" placeholder="Description courte du produit"></textarea>
    </div>

    <div class="form-group">
      <label for="f-prix">Prix (€)</label>
      <input id="f-prix" type="number" min="0.01" step="0.01" [(ngModel)]="form.prix" name="prix" placeholder="30.00" required />
    </div>

    <div class="form-group">
      <label for="f-stock">Stock</label>
      <input id="f-stock" type="number" min="0" [(ngModel)]="form.stock" name="stock" placeholder="100" required />
    </div>

    <div class="form-group">
      <label for="imageFile">Image</label>
      <input id="imageFile" type="file" #imageFileInput accept="image/*" (change)="onFileSelected($event)" />
      <div class="photo-preview" *ngIf="imagePreview">
        <img [src]="imagePreview" alt="Aperçu du produit">
        <div class="uploading" *ngIf="uploading">Téléversement…</div>
      </div>
    </div>

    <div class="modal-footer">
      <ui-button type="button" variant="ghost" label="Annuler" (clicked)="fermerModal()"></ui-button>
      <ui-button type="submit" variant="primary"
        [label]="saving ? 'Enregistrement…' : (modalMode === 'add' ? 'Créer le produit' : 'Enregistrer')"
        [disabled]="saving || uploading">
      </ui-button>
    </div>
  </form>
</ui-modal>
