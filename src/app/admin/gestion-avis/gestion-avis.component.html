<div class="page-shell">
  <app-page-header title="Gestion des avis" icon="ri-star-line"></app-page-header>

  <div class="filters-bar">
    <input
      type="text"
      class="form-input"
      placeholder="Rechercher un avis..."
      [(ngModel)]="searchTerm"
      name="searchTerm"
    />

    <select class="form-select" [(ngModel)]="approvalFilter" name="approvalFilter">
      <option value="">Tous les avis</option>
      <option value="pending">En attente</option>
      <option value="approved">Approuves</option>
    </select>
  </div>

  <div class="table-wrap">
    <ui-table
      [columns]="columns"
      [data]="filteredAvis()"
      [actions]="actions"
      (actionClick)="onTableAction($event)"
    ></ui-table>
  </div>
</div>
