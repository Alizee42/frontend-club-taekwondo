<section class="avis-section">
  <div class="header-bar-avis">
    <ui-title [level]="2" text="Gestion des avis"></ui-title>
  </div>
  <!-- Table des avis -->
  <ui-table
    [columns]="columns"
    [data]="avis"
    [actions]="actions"
    (actionClick)="onTableAction($event)"
  ></ui-table>
  <div *ngIf="!avis || avis.length === 0">Aucun avis pour le moment.</div>
</section>
