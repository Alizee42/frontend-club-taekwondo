<div class="dash-admin">

  <!-- En-tête -->
  <div class="dash-header">
    <div class="dash-header__panel">
      <i class="ri-layout-grid-line"></i>
    </div>
    <div class="dash-header__body">
      <h1 class="dash-header__title">Tableau de bord</h1>
      <p class="dash-header__sub">Bonjour, <strong>{{ getUserName() }}</strong></p>
    </div>
    <div class="dash-header__date">
      <i class="ri-calendar-2-line"></i>
      <span>{{ today | date:'d MMM yyyy' }}</span>
    </div>
  </div>

  <!-- KPI -->
  <ui-kpi-grid [cols]="4">
    <ui-kpi-card icon="ri-team-line"         label="Membres inscrits"      [value]="nbMembres"                                         tone="blue"   [loading]="loading"></ui-kpi-card>
    <ui-kpi-card icon="ri-hand-coin-line"    label="Paiements reçus"       [value]="totalPaiements | currency:'EUR':'symbol':'1.0-0'"   tone="green"  [loading]="loading"></ui-kpi-card>
    <ui-kpi-card icon="ri-time-line"         label="Paiements en attente"  [value]="paiementsAttente"                                   tone="amber"  [loading]="loading"></ui-kpi-card>
    <ui-kpi-card icon="ri-calendar-event-line" label="Événements à venir"  [value]="evenementsAVenir"                                   tone="purple" [loading]="loading"></ui-kpi-card>
  </ui-kpi-grid>

  <!-- Sections de navigation -->
  <div class="dash-sections">

    <div class="dash-section">
      <div class="dash-section__head dash-section__head--blue">
        <i class="ri-calendar-check-line"></i>
        <span>Vie du club</span>
      </div>
      <div class="dash-section__body">
        <app-dashboard-nav-card
          label="Événements"
          icon="ri-calendar-event-line"
          badgeVariant="neutral"
          [badge]="evenementsAVenir > 0 ? evenementsAVenir : null"
          (pressed)="navigateToGestionEvenements()"
        />
        <app-dashboard-nav-card
          label="Horaires"
          icon="ri-time-line"
          badgeVariant="neutral"
          [badge]="badge.horaires > 0 ? badge.horaires : null"
          (pressed)="navigateToHoraires()"
        />
        <app-dashboard-nav-card
          label="Professeurs"
          icon="ri-user-star-line"
          (pressed)="navigateToProfesseurs()"
        />
      </div>
    </div>

    <div class="dash-section">
      <div class="dash-section__head dash-section__head--green">
        <i class="ri-user-line"></i>
        <span>Adhérents</span>
      </div>
      <div class="dash-section__body">
        <app-dashboard-nav-card
          label="Membres & Comptes"
          icon="ri-team-line"
          badgeVariant="neutral"
          [badge]="nbMembres > 0 ? nbMembres : null"
          (pressed)="navigateToGestionMembres()"
        />
        <app-dashboard-nav-card
          label="Documents"
          icon="ri-file-list-line"
          [badge]="badge.documents > 0 ? badge.documents : null"
          (pressed)="navigateToDocument()"
        />
        <app-dashboard-nav-card
          label="Avis"
          icon="ri-star-line"
          [badge]="badge.avis > 0 ? badge.avis : null"
          (pressed)="navigateToavis()"
        />
      </div>
    </div>

    <div class="dash-section">
      <div class="dash-section__head dash-section__head--amber">
        <i class="ri-wallet-3-line"></i>
        <span>Boutique et paiements</span>
      </div>
      <div class="dash-section__body">
        <app-dashboard-nav-card
          label="Paiements"
          icon="ri-money-euro-circle-line"
          [badge]="badge.paiements > 0 ? badge.paiements : null"
          (pressed)="navigateToPaiement()"
        />
        <app-dashboard-nav-card
          label="Commandes"
          icon="ri-shopping-bag-3-line"
          [badge]="badge.commandes > 0 ? badge.commandes : null"
          (pressed)="navigateToGestionCommande()"
        />
        <app-dashboard-nav-card
          label="Produits boutique"
          icon="ri-price-tag-3-line"
          (pressed)="navigateToGestionProduits()"
        />
      </div>
    </div>

    <div class="dash-section">
      <div class="dash-section__head dash-section__head--purple">
        <i class="ri-megaphone-line"></i>
        <span>Site public</span>
      </div>
      <div class="dash-section__body">
        <app-dashboard-nav-card
          label="Accueil du site"
          icon="ri-home-4-line"
          (pressed)="navigateToAccueilSite()"
        />
        <app-dashboard-nav-card
          label="Actualités"
          icon="ri-newspaper-line"
          [badge]="badge.actualites > 0 ? badge.actualites : null"
          (pressed)="navigateToActualites()"
        />
        <app-dashboard-nav-card
          label="Galerie / Médias"
          icon="ri-image-line"
          (pressed)="navigateToGalerie()"
        />
      </div>
    </div>

  </div>

</div>
