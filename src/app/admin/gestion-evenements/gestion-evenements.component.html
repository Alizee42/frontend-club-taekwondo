<div class="page-shell">
  <app-page-header
    title="Gestion des événements"
    icon="ri-calendar-event-line"
    subtitle="Créer, suivre et administrer les événements du club"
  >
    <ng-container page-header-actions>
      @if (isClubLocked) {
        <span class="club-chip">
          <i class="ri-building-4-line"></i>
          {{ selectedClubName || '…' }}
        </span>
      } @else {
        <span class="club-picker-inline">
          <span class="club-picker-inline__label">Club</span>
          <select class="form-select" [ngModel]="selectedClubId" (ngModelChange)="onSelectClub($event)">
            <option [ngValue]="null">Choisir un club…</option>
            @for (c of clubs; track c.id) {
              <option [ngValue]="c.id">{{ c.nom || c.name }}</option>
            }
          </select>
        </span>
      }
      <ui-button
        label="Créer un événement"
        icon="ri-add-line"
        variant="primary"
        [disabled]="!selectedClubId"
        (clicked)="ouvrirFormulaireCreation()"
      ></ui-button>
    </ng-container>
  </app-page-header>

  <ui-kpi-grid [cols]="4">
    <ui-kpi-card icon="ri-calendar-event-line"  label="Événements"         [value]="totalEvenements"         tone="primary" [loading]="isLoading"></ui-kpi-card>
    <ui-kpi-card icon="ri-team-line"            label="Inscriptions totales" [value]="totalInscrits"          tone="info"    [loading]="isLoading"></ui-kpi-card>
    <ui-kpi-card icon="ri-calendar-check-line"  label="Événements actifs"   [value]="totalActifs"             tone="success" [loading]="isLoading"></ui-kpi-card>
    <ui-kpi-card icon="ri-map-pin-time-line"    label="Prochain rendez-vous" [value]="prochainEvenementDate" [meta]="prochainEvenementMeta" tone="purple" [loading]="isLoading"></ui-kpi-card>
  </ui-kpi-grid>

  <div class="filters-bar">
    <input
      type="text"
      class="form-input"
      [(ngModel)]="searchTerm"
      placeholder="Rechercher un événement..."
      aria-label="Rechercher un événement"
    />

    <select
      class="form-select"
      [(ngModel)]="statusFilter"
      aria-label="Filtrer par statut"
    >
      <option value="">Tous les statuts</option>
      <option value="actif">Actifs</option>
      <option value="inactif">Inactifs</option>
    </select>

    <select
      class="form-select"
      [(ngModel)]="sortBy"
      aria-label="Trier les evenements"
    >
      <option value="dateDebut">Trier par date</option>
      <option value="titre">Trier par titre</option>
      <option value="nbInscrits">Trier par inscrits</option>
    </select>

    <select
      class="form-select"
      [(ngModel)]="sortOrder"
      aria-label="Ordre de tri"
    >
      <option value="asc">Ordre croissant</option>
      <option value="desc">Ordre decroissant</option>
    </select>

    <ui-button
      label="Rafraichir"
      icon="ri-refresh-line"
      variant="secondary"
      [loading]="isLoading"
      (clicked)="chargerEvenements()"
    ></ui-button>
  </div>

  @if (!selectedClubId) {
    <div class="gp-state">
      <i class="ri-building-4-line"></i>
      <span>Choisis un club ci-dessus pour afficher et gérer ses événements.</span>
    </div>
  } @else {
    <div class="table-wrap">
      <ui-table
        [columns]="eventColumns"
        [data]="eventTableRows"
        [actions]="eventActions"
        (actionClick)="onEventAction($event)"
      ></ui-table>
    </div>
  }
</div>

<ui-modal
  [open]="afficherFormulaire"
  [title]="isEditing ? 'Modifier un evenement' : 'Creer un evenement'"
  size="lg"
  (closed)="fermerFormulaire()"
>
  <form class="event-form" (ngSubmit)="soumettreEvenement()">
    <div class="form-grid">
      <label class="field">
        <span class="field-label">Titre</span>
        <input
          type="text"
          class="form-input"
          [(ngModel)]="nouvelEvenement.titre"
          name="titre"
          required
        />
      </label>

      <label class="field">
        <span class="field-label">Lieu</span>
        <input
          type="text"
          class="form-input"
          [(ngModel)]="nouvelEvenement.lieu"
          name="lieu"
          required
        />
      </label>

      <label class="field">
        <span class="field-label">Date début</span>
        <div class="field-date-heure">
          <input
            type="date"
            class="form-input"
            [(ngModel)]="dateDebutJour"
            name="dateDebutJour"
            required
          />
          <select class="form-select" [(ngModel)]="dateDebutH" name="dateDebutH" required>
            <option value="" disabled selected hidden>Heure</option>
            <option *ngFor="let h of heuresDisponibles" [value]="h">{{ h }}</option>
          </select>
          <select class="form-select" [(ngModel)]="dateDebutMin" name="dateDebutMin" required>
            <option value="" disabled selected hidden>Min</option>
            <option *ngFor="let m of minutesDisponibles" [value]="m">{{ m }}</option>
          </select>
        </div>
      </label>

      <label class="field">
        <span class="field-label">Date fin</span>
        <div class="field-date-heure">
          <input
            type="date"
            class="form-input"
            [(ngModel)]="dateFinJour"
            name="dateFinJour"
            required
          />
          <select class="form-select" [(ngModel)]="dateFinH" name="dateFinH" required>
            <option value="" disabled selected hidden>Heure</option>
            <option *ngFor="let h of heuresDisponibles" [value]="h">{{ h }}</option>
          </select>
          <select class="form-select" [(ngModel)]="dateFinMin" name="dateFinMin" required>
            <option value="" disabled selected hidden>Min</option>
            <option *ngFor="let m of minutesDisponibles" [value]="m">{{ m }}</option>
          </select>
        </div>
      </label>

      <label class="field">
        <span class="field-label">Capacité</span>
        <input
          type="number"
          min="1"
          class="form-input"
          [(ngModel)]="nouvelEvenement.capacite"
          name="capacite"
          required
        />
      </label>

      <label class="field field--checkbox">
        <span class="field-label">Statut</span>
        <span class="checkbox-line">
          <input
            type="checkbox"
            [(ngModel)]="nouvelEvenement.actif"
            name="actif"
          />
          <span>Evenement actif</span>
        </span>
      </label>
    </div>

    <label class="field">
      <span class="field-label">Description</span>
      <textarea
        class="form-input form-textarea"
        [(ngModel)]="nouvelEvenement.description"
        name="description"
        rows="4"
      ></textarea>
    </label>

    <label class="field">
      <span class="field-label">Image</span>
      <input
        type="file"
        class="form-input"
        accept="image/*"
        (change)="onFileSelected($event)"
      />
    </label>

    <div class="image-preview" *ngIf="nouvelEvenement.imageUrl">
      <img [src]="nouvelEvenement.imageUrl" alt="Apercu de l evenement" />
    </div>

    <div class="modal-actions">
      <ui-button
        label="Annuler"
        variant="ghost"
        type="button"
        (clicked)="fermerFormulaire()"
      ></ui-button>
      <ui-button
        [label]="isEditing ? 'Enregistrer' : 'Créer'"
        icon="ri-save-line"
        variant="primary"
        type="submit"
        [loading]="isLoading"
      ></ui-button>
    </div>
  </form>
</ui-modal>

<ui-modal
  [open]="!!evenementSelectionne"
  [title]="evenementSelectionne ? 'Inscriptions - ' + evenementSelectionne.titre : 'Inscriptions'"
  size="xl"
  (closed)="fermerInscriptions()"
>
  <div *ngIf="evenementSelectionne as evenement" class="registrations-panel">
    <div class="registration-summary">
      <span class="summary-chip">
        <i class="ri-group-line" aria-hidden="true"></i>
        {{ inscriptionsActives.length }} participant(s)
      </span>
      <span class="summary-chip summary-chip--warning" *ngIf="nbInscritsAttente > 0">
        <i class="ri-time-line" aria-hidden="true"></i>
        {{ nbInscritsAttente }} a valider
      </span>
    </div>

    <div class="table-wrap">
      <ui-table
        [columns]="inscriptionColumns"
        [data]="inscriptionTableRows"
        [actions]="inscriptionActions"
        (actionClick)="onInscriptionAction($event)"
      ></ui-table>
    </div>
  </div>
</ui-modal>
