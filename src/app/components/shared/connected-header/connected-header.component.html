<header class="connected-header">
  <div class="header-content">
    <!-- Logo segmenté identique au header public -->
    <div class="logo">
      <a [routerLink]="['/']" (click)="closeUserDropdown()">
        <span class="brand-strong">Olympique</span>
        <span class="brand-mid">Taekwondo</span>
        <span class="brand-thin">Villeurbannais</span>
      </a>
    </div>

    <!-- Navigation interne -->
    <nav class="connected-nav">
      <button type="button" class="nav-item" (click)="goToDashboard()">Dashboard</button>
      <a class="nav-item" [routerLink]="['/']">Accueil du site</a>
    </nav>

    <!-- Actions utilisateur (notifications + menu) -->
    <div class="user-actions">
      <div class="actions-inline">
        <!-- Dropdown utilisateur (à gauche) -->
        <div class="user-dropdown">
          <button class="user-btn" (click)="toggleUserDropdown()">
            <div class="avatar">{{ getUserInitials() }}</div>
            <span class="username">{{ getUserName() }}</span>
            <span class="arrow" [class.open]="userDropdownOpen">▼</span>
          </button>
          <div class="dropdown" [class.show]="userDropdownOpen">
            <button class="menu-item" (click)="goToProfil(); closeUserDropdown()">👤 Mon Profil</button>
            <hr class="separator">
            <button class="menu-item logout" (click)="logout(); closeUserDropdown()">🚪 Se déconnecter</button>
          </div>
        </div>
        <!-- Notifications (à droite) -->
        <div class="notification-wrapper">
          <div class="notification-icon" (click)="toggleNotifications()">
            <i class="ri-notification-line"></i>
            <span class="badge" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
          </div>
          <div class="notification-preview" *ngIf="notificationsOpen">
            <div class="notification-header">
              <h4>Notifications</h4>
              <button class="mark-all-read" *ngIf="unreadCount > 0" (click)="markAllAsRead()">Tout marquer comme lu</button>
            </div>
            <div *ngIf="notifications.length === 0" class="no-notifications"><p>Aucune notification</p></div>
            <ul *ngIf="notifications.length > 0" class="notification-list">
              <li *ngFor="let n of notifications" class="notification-item" [class.unread]="!n.lu" (click)="markAsRead(n)">
                <div class="notification-icon-item"><i [class]="getNotificationIcon(n.type)"></i></div>
                <div class="notification-content">
                  <h5>{{ n.titre }}</h5>
                  <p>{{ n.message }}</p>
                  <span class="notification-time">{{ getTimeAgo(n.date) }}</span>
                </div>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
