<div class="page-wrapper-standard">
  <header class="page-head">
    <h1 class="page-title">Boutique</h1>
    <p class="page-subtitle">Equipements officiels & tenues du club</p>
  </header>
  <div class="boutique-container">
  <h2 class="visually-hidden">Catalogue</h2>

  <div class="produit" *ngFor="let p of produits">
    <div class="produit-image-container">
      <img [src]="p.imageUrl" [alt]="p.nom" class="produit-image" />
    </div>

    <div class="produit-info">
      <h3>{{ p.nom }}</h3>
      <p>{{ p.description }}</p>
      <p class="prix-base">Prix : <strong>{{ p.prixBase | number:'1.2-2' }} €</strong></p>

      <div class="options">
        <!-- Taille -->
        <div class="option">
          <label [for]="'taille-' + p.id">Taille :</label>
          <select
            [id]="'taille-' + p.id"
            [(ngModel)]="selections[p.id].taille"
            (ngModelChange)="onChangeTaille(p, $event)">
            <option [ngValue]="null">-- Sélectionnez --</option>
            <option *ngFor="let t of tailles" [value]="t">{{ t }}</option>
          </select>
        </div>

        <!-- Flocage -->
        <div class="option flocage-option">
          <input
            type="checkbox"
            [id]="'flocage-' + p.id"
            [(ngModel)]="selections[p.id].flocageActif"
            (ngModelChange)="onToggleFloquage(p, $event)" />
          <label [for]="'flocage-' + p.id">Flocage "TKT Villeurbannais" (+10 €)</label>
        </div>

        <!-- Quantité -->
        <div class="option">
          <label [for]="'quantite-' + p.id">Quantité :</label>
          <input
            [id]="'quantite-' + p.id"
            type="number"
            min="1"
            [(ngModel)]="selections[p.id].quantite"
            (ngModelChange)="onChangeQuantite(p, $event)" />
        </div>

        <!-- Prix live -->
        <p class="prix-total">
          Prix unitaire :
          <strong>{{ getPrixUnitaire(p) | number:'1.2-2' }} €</strong><br>
          Prix total :
          <strong>{{ getPrixTotal(p) | number:'1.2-2' }} €</strong>
        </p>
      </div>

      <button
        class="btn-ajouter-panier"
        (click)="ajouterAuPanier(p)"
        [disabled]="!selections[p.id].taille">
        Ajouter au panier
      </button>

      <p class="confirmation" *ngIf="confirmationMessage">{{ confirmationMessage }}</p>
    </div>
  </div>
  </div>
</div>
