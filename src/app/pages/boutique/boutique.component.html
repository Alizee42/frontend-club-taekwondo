<div class="boutique-container">
  <h2>Boutique - Dobok Taekwondo</h2>

  <div class="produit">
    <div class="produit-image-container">
      <img src="assets/images/dobok.jpg" alt="Dobok Taekwondo" class="produit-image">
    </div>

    <div class="produit-info">
      <h3>Dobok Taekwondo</h3>
      <p>Tenue blanche officielle en coton pour la pratique du Taekwondo.</p>
      <p class="prix-base">Prix : <strong>30 €</strong></p>

      <div class="options">
        <div class="option">
          <label for="taille">Taille :</label>
          <select id="taille" (change)="updatePrixTotal()">
            <option value="">-- Sélectionnez --</option>
            <option value="120">120 cm</option>
            <option value="130">130 cm</option>
            <option value="140">140 cm</option>
            <option value="150">150 cm</option>
            <option value="160">160 cm</option>
          </select>
        </div>

        <div class="option flocage-option">
          <input type="checkbox" id="flocage" (change)="updatePrixTotal()" />
          <label for="flocage">Flocage "Tkt Villeurbannais" (+10 €)</label>
        </div>

        <div class="option">
          <label for="quantite">Quantité :</label>
          <input id="quantite" type="number" min="1" value="1" (change)="updatePrixTotal()" />
        </div>

        <p class="prix-total">Prix total : <span id="prix-total">30</span> €</p>
      </div>

      <button class="btn-ajouter-panier" (click)="ajouterAuPanier(produits[0])">Ajouter au panier</button>
    </div>
  </div>
</div>
