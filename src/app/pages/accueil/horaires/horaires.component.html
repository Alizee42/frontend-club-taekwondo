<section id="horaires" class="schedule-section">
  <div class="container">

    <div class="section-head">
      <span class="section-eyebrow">Nos créneaux</span>
      <h2 class="section-title">Horaires des Cours</h2>
    </div>

    <div *ngIf="!horairesParJour || horairesParJour.length === 0" class="no-horaires-message">
      Aucun horaire disponible pour ce club.
    </div>

    <div class="schedule-grid" *ngIf="horairesParJour && horairesParJour.length > 0">
      <div *ngFor="let jourBlock of horairesParJour" class="schedule-card">
        <div class="schedule-card__header">
          <i class="ri-calendar-line" aria-hidden="true"></i>
          <span class="day-badge">{{ jourBlock.jour }}</span>
        </div>
        <div class="schedule-card__body">
          <ng-container *ngFor="let groupe of (jourBlock.horaires | groupBy:'groupe')">
            <fieldset class="horaire-groupe">
              <legend class="horaire-groupe-label">{{ groupe.key || 'Sans groupe' }}</legend>
              <ng-container *ngFor="let h of groupe.items">
                <div class="horaire-time-row">
                  <span class="time">
                    <i class="ri-time-line" *ngIf="h.plage || (h.heureDebut && h.heureFin)" aria-hidden="true"></i>
                    {{ h.plage ? h.plage : (h.heureDebut && h.heureFin ? h.heureDebut + ' - ' + h.heureFin : '') }}
                  </span>
                  <span *ngIf="h.adresse || h.codePostal || h.ville" class="card-adresse">
                    <span class="horaire-addr-line">
                      <i class="ri-map-pin-line" aria-hidden="true"></i>
                      <span>{{ h.adresse }}</span>
                    </span>
                    <span *ngIf="h.codePostal || h.ville" class="horaire-addr-city">
                      {{ h.codePostal }}<span *ngIf="h.codePostal && h.ville">&nbsp;</span>{{ h.ville }}
                    </span>
                  </span>
                </div>
              </ng-container>
            </fieldset>
          </ng-container>
        </div>
      </div>
    </div>

  </div>
</section>
