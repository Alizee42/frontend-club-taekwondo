<section id="schedule-info" class="schedule-info-section">
    <div class="container">
      <h2 class="section-title">Horaires des Cours</h2>
      <div class="schedule-info-container">
        <div class="schedule-grid">
          <div *ngFor="let horaire of horaires" class="schedule-card premium">
            <div class="card-header">
              <span class="day-badge">{{ horaire.jour }}</span>
            </div>
            <ul class="card-hours">
              <li *ngFor="let heure of horaire.heures">
                <i class="fas fa-clock"></i>
                <span class="time">{{ heure.time }}</span>
                <span class="groupe-badge">{{ heure.groupe }}</span>
              </li>
            </ul>
            <div class="card-divider"></div>
            <div class="card-adresse">
              <i class="fas fa-map-marker-alt"></i>
              <span>{{ horaire.adresse }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
