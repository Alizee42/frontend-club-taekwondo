<section id="actualites" class="section-actualites">
  <div class="section-title-wrapper">
    <h2 class="section-title">Actualités</h2>
  </div>
  <div class="container">
    <!-- Actualité à la une -->
    <div *ngIf="featuredNews" class="actu-featured-slider">
      <div class="slider-featured-image">
        <img 
          [src]="featuredNews.imageUrl ? featuredNews.imageUrl : 'assets/images/dobok.jpg'"
          [attr.alt]="featuredNews.titre + ' – image à la une'"
          (error)="onImageError($event)"
          loading="lazy" decoding="async"
        >
          <span class="badge badge-slider-featured"
                [ngClass]="'badge-' + (featuredNews.typeActu?.toLowerCase() || 'default')"
          >{{ featuredNews.typeActu }}</span>
      </div>
      <div class="slider-featured-content">
        <h3>{{ featuredNews.titre }}</h3>
        <p>{{ featuredNews.contenu | slice:0:200 }}...</p>
        <div class="featured-btn-wrapper">
          <ui-button
            variant="primary"
            [label]="'En savoir plus'"
            [routerLink]="['/actualite', featuredNews.id]"
            customClass="banner-small"
          ></ui-button>
        </div>
      </div>
    </div>

    <!-- Slider horizontal des autres actualités -->
    <div class="actu-slider-wrapper">
      <div class="actu-slider" tabindex="0">
        <div *ngFor="let actu of filteredNews; trackBy: trackById" class="actu-slider-card">
          <div class="slider-card-image">
            <img 
              [src]="actu.imageUrl ? actu.imageUrl : 'assets/images/dobok.jpg'" 
              [attr.alt]="'Illustration: ' + actu.titre" 
              (error)="onImageError($event)" 
              loading="lazy" decoding="async"
            >
            <span class="badge badge-slider"
                  [ngClass]="'badge-' + (actu.typeActu?.toLowerCase() || 'default')"
            >{{ actu.typeActu }}</span>
          </div>
          <div class="slider-card-content">
            <h4>{{ actu.titre }}</h4>
            <p>{{ actu.contenu | slice:0:100 }}...</p>
            <div class="card-btn-wrapper">
              <ui-button
                variant="secondary"
                [label]="'Lire'"
                [routerLink]="['/actualite', actu.id]"
                customClass="banner-small"
              ></ui-button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
