<section id="actualites" class="section-actualites">
  <div class="container">

    <div class="section-head">
      <span class="section-eyebrow">La vie du club</span>
      <h2 class="section-title">Actualités</h2>
    </div>

    <div class="actu-grid">
      <div
        *ngFor="let actu of news.slice(0, 3); trackBy: trackById"
        class="actu-card"
        [routerLink]="['/actualite', actu.id]"
      >
        <div class="actu-card__img">
          <img
            [src]="actu.imageUrl || 'assets/images/dobok.jpg'"
            [attr.alt]="actu.titre"
            (error)="onImageError($event)"
            loading="lazy"
          >
          <span class="actu-badge badge-{{ actu.typeActu?.toLowerCase() || 'default' }}">
            {{ actu.typeActu || 'Info' }}
          </span>
        </div>
        <div class="actu-card__body">
          <span class="actu-card__date" *ngIf="actu.datePublication">
            {{ actu.datePublication | date:'d MMM yyyy' }}
          </span>
          <h3 class="actu-card__title">{{ actu.titre }}</h3>
          <p class="actu-card__excerpt">{{ actu.contenu | slice:0:110 }}…</p>
          <span class="actu-card__link">
            Lire la suite <i class="ri-arrow-right-line"></i>
          </span>
        </div>
      </div>
    </div>

  </div>
</section>
