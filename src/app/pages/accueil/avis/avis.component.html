<section id="avis" class="avis-section">
  <div class="container">
    <div class="section-head">
      <span class="section-eyebrow">Témoignages</span>
      <h2 class="section-title">Ce que disent nos membres</h2>
    </div>

    <div *ngIf="messageConfirmation" class="alert alert-success" role="status" aria-live="polite">
      {{ messageConfirmation }}
    </div>

    <div class="swiper avis-swiper" aria-label="Avis des visiteurs">
      <div class="swiper-wrapper">

        <div *ngIf="(avisApprouves?.length || 0) === 0" class="swiper-slide">
          <div class="avis-card single">
            <p class="avis-text">Aucun avis pour le moment.</p>
          </div>
        </div>

        <div *ngFor="let avis of avisApprouves; trackBy: trackByAvisId" class="swiper-slide">
          <div class="avis-card" [ngClass]="{'single': avisApprouves.length === 1}">

            <div class="avis-top">
              <div class="note-stars" [attr.aria-label]="'Note : ' + (avis.note || 0) + '/5'">
                <span *ngFor="let star of [1,2,3,4,5]">
                  <i class="ri-star-fill" *ngIf="star <= (avis.note || 0)" aria-hidden="true"></i>
                  <i class="ri-star-line" *ngIf="star > (avis.note || 0)" aria-hidden="true"></i>
                </span>
              </div>
              <span class="badge-verified">
                <i class="ri-shield-check-line" aria-hidden="true"></i> Vérifié
              </span>
            </div>

            <p class="avis-text">"{{ avis.contenu }}"</p>

            <div class="avis-author">
              <div *ngIf="!avis.photo" class="initials" [attr.aria-label]="'Initiales de ' + (avis.pseudoVisiteur || 'Anonyme')">
                {{ getInitials(avis.pseudoVisiteur || 'Anonyme') }}
              </div>
              <img *ngIf="avis.photo" [src]="getPhotoUrl(avis.photo)" alt="Photo de {{ avis.pseudoVisiteur || 'Anonyme' }}" class="avis-photo" loading="lazy" width="36" height="36" />
              <div class="avis-author-info">
                <strong>{{ avis.pseudoVisiteur || 'Anonyme' }}</strong>
                <span>{{ avis.typeAvis || 'Avis général' }}</span>
              </div>
            </div>

          </div>
        </div>
      </div>

      <div class="swiper-pagination"></div>
      <div *ngIf="avisApprouves.length > 3" class="swiper-button-prev" aria-label="Avis précédent"></div>
      <div *ngIf="avisApprouves.length > 3" class="swiper-button-next" aria-label="Avis suivant"></div>
    </div>

    <div class="avis-cta-wrapper">
      <ui-button variant="primary" [label]="'Laisser un avis'" (clicked)="ouvrirModale()" customClass="banner-small"></ui-button>
    </div>
  </div>

  <div class="modale" [class.active]="modaleOuverte">
    <div class="modale-content" role="dialog" aria-modal="true" aria-labelledby="avisModalTitle" (click)="$event.stopPropagation()">
      <div class="ui-modal-header">
        <span class="ui-modal-title" id="avisModalTitle">Laisser un avis</span>
        <button class="ui-modal-close" type="button" (click)="fermerModale()" aria-label="Fermer">×</button>
      </div>
      <ui-form
        [description]="'Votre retour est précieux pour la communauté du club !'"
        [fields]="fieldsAvis"
        [submitLabel]="'Envoyer'"
        (submitted)="onFormSubmit($event)"
        [loading]="loadingAvis"
        [error]="formError"
      ></ui-form>
    </div>
  </div>
</section>
