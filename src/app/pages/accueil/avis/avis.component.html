<section id="avis" class="avis-section">
  <div class="section-title-wrapper">
  <h2 class="section-title">Vos retours & témoignages</h2>
  </div>
  <div class="container">

    <!-- Message de confirmation (aria-live pour lecteurs d'écran) -->
    <div *ngIf="messageConfirmation" class="alert alert-success" role="status" aria-live="polite">
      {{ messageConfirmation }}
    </div>

    <!-- Carrousel des avis -->
    <div class="swiper avis-swiper" aria-label="Avis des visiteurs">
      <div class="swiper-wrapper">
        <!-- état vide -->

        <div *ngIf="(avisApprouves?.length || 0) === 0" class="swiper-slide">
          <div class="avis-card single">
            <p class="avis-text">Aucun avis pour le moment.</p>
          </div>
        </div>

        <div *ngFor="let avis of avisApprouves; trackBy: trackByAvisId" class="swiper-slide">
          <div class="avis-card premium" [ngClass]="{'single': avisApprouves.length === 1}">
            <span class="badge-verified">✔ Avis vérifié</span>
            <p class="avis-text">“{{ avis.contenu }}”</p>

            <div class="avis-author">
              <div class="photo-container">
                <img
                  *ngIf="avis.photo"
                  [src]="getPhotoUrl(avis.photo)"
                  alt="Photo de {{ avis.pseudoVisiteur || 'Anonyme' }}"
                  class="avis-photo"
                  loading="lazy"
                  width="60" height="60"
                />
                <div
                  *ngIf="!avis.photo"
                  class="initials"
                  [attr.aria-label]="'Initiales de ' + (avis.pseudoVisiteur || 'Anonyme')"
                >
                  {{ getInitials(avis.pseudoVisiteur || 'Anonyme') }}
                </div>
              </div>
              <div>
                <strong>{{ avis.pseudoVisiteur || 'Anonyme' }}</strong><br />
                <span>{{ avis.typeAvis || 'Avis général' }}</span>
              </div>
            </div>

            <div class="note-stars" [attr.aria-label]="'Note : ' + (avis.note || 0) + '/5'">
              <span *ngFor="let star of [1,2,3,4,5]">
                <i class="ri-star-fill" *ngIf="star <= (avis.note || 0)" aria-hidden="true"></i>
                <i class="ri-star-line" *ngIf="star > (avis.note || 0)" aria-hidden="true"></i>
              </span>
            </div>
          </div>
        </div>
      </div>

  <!-- Pagination -->
  <div class="swiper-pagination" aria-label="Pagination des avis"></div>

  <!-- Flèches : affichées seulement s'il y a plus d'un avis -->
  <div *ngIf="avisApprouves.length > 1" class="swiper-button-prev" aria-label="Avis précédent"></div>
  <div *ngIf="avisApprouves.length > 1" class="swiper-button-next" aria-label="Avis suivant"></div>
    </div>

    <!-- Bouton pour laisser un avis -->
    <div style="text-align:center; margin-top:1.2rem;">
      <ui-button
        variant="primary"
        [label]="'Laisser un avis'"
        (clicked)="ouvrirModale()"
        customClass="banner-small"
      ></ui-button>
    </div>
  </div>

  <!-- Modale pour laisser un avis -->
  <div class="modale" [class.active]="modaleOuverte">
    <div
      class="modale-content"
      role="dialog"
      aria-modal="true"
      aria-labelledby="avisModalTitle"
      aria-describedby="avisModalDesc"
      (click)="$event.stopPropagation()"
    >
      <div class="ui-modal-header">
        <span class="ui-modal-title">Laisser un avis</span>
        <button class="ui-modal-close" type="button" (click)="fermerModale()" aria-label="Fermer">×</button>
      </div>
      <ui-form
        [description]="'Votre retour est précieux pour la communauté du club !'"
        [fields]="fieldsAvis"
        [submitLabel]="'Envoyer'"
        (submitted)="onFormSubmit($event)"
        [loading]="loadingAvis"
        [error]="formError"
      ></ui-form>
    </div>
  </div>
</section>
