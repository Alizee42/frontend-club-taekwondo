<universal-header clubName="Villeurbannais" logoUrl="/assets/images/logo.png"></universal-header>
<div class="page-wrapper-standard">
  <header class="page-head" style="text-align:center; margin-bottom:2.5rem;">
    <h1 class="page-title" style="font-size:2.5rem; font-weight:700; letter-spacing:1px; color:var(--blue-main); margin-bottom:.5rem; position:relative; display:inline-block;">
      Galerie
      <span style="display:block; height:5px; width:60px; background:linear-gradient(90deg,#e63946 0%,#ff7b7b 100%); border-radius:3px; margin:0.5rem auto 0;"></span>
    </h1>
    <p class="page-subtitle" style="font-size:1.15rem; color:#334155; margin-bottom:0;">Souvenirs et moments forts du club</p>
  </header>
  <section class="gallery-container">
    <div class="grid-gallery">
      <div class="grid-item" *ngFor="let image of images">
        <img [src]="image.imageUrl" [alt]="image.titre" />
        <h3>{{ image.titre }}</h3>
        <p>{{ image.description | slice: 0:100 }}...</p>
      </div>
    </div>
  </section>
</div>
