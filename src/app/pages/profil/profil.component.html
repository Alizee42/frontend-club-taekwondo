

<div class="profile-page">
  <div class="profile-card">
    <!-- Photo et infos -->
    <div class="profile-header">
      <div class="initials-circle">
        {{ getInitiales( user.prenom,user.nom) }}
      </div>
            <h2> {{ user.prenom || 'Prénom' }} {{ user.nom || 'Nom' }}</h2>
      <p class="profile-role">{{ user.role | titlecase }}</p>
    </div>

    <!-- Formulaire de modification -->
    <form (ngSubmit)="saveProfile()" class="profile-form">
      <div class="form-section">
        <div class="form-group" *ngFor="let champ of ['nom', 'prenom', 'email', 'telephone']">
          <label [for]="champ">{{ champ | titlecase }}</label>
          <div class="form-field">
            <span *ngIf="!editMode[champ]">{{ user[champ] || '...' }}</span>
            <input *ngIf="editMode[champ]"
              [type]="champ === 'email' ? 'email' : 'text'"
              [id]="champ"
              [(ngModel)]="user[champ]"
              [name]="champ"
              required
              class="form-control" />
            <button type="button" class="btn-edit" (click)="toggleEdit(champ)" title="Modifier">
              <i class="ri-edit-2-line"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="form-actions">
        <button type="submit" class="btn-save">💾 Sauvegarder</button>
        <button type="button" class="btn-password" (click)="openPasswordModal()">🔐 Modifier le mot de passe</button>
      </div>
    </form>
  </div>

  <!-- Modale de mot de passe -->
  <div class="modal" *ngIf="showPasswordModal">
    <div class="modal-content">
      <h2>🔐 Changer le mot de passe</h2>
      <form (ngSubmit)="updatePassword()">
        <div class="form-group">
          <label for="newPassword">Nouveau mot de passe</label>
          <input type="password" id="newPassword" [(ngModel)]="passwordData.newPassword" name="newPassword" required class="form-control" />
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirmer le mot de passe</label>
          <input type="password" id="confirmPassword" [(ngModel)]="passwordData.confirmPassword" name="confirmPassword" required class="form-control" />
        </div>
        <p *ngIf="passwordError" class="error">{{ passwordError }}</p>
        <div class="form-actions">
          <button type="submit" class="btn-save">Enregistrer</button>
          <button type="button" class="btn-cancel" (click)="closePasswordModal()">Annuler</button>
        </div>
      </form>
    </div>
  </div>
</div>
