<div class="login-container">
  <div class="login-card">
    <h1>Connexion</h1>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          required
          autocomplete="username"
        />
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>

        <div class="password-wrapper">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            name="password"
            [(ngModel)]="password"
            required
            autocomplete="current-password"
          />

          <button
            type="button"
            class="toggle-password"
            (click)="togglePassword()"
            [attr.aria-label]="showPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
            [attr.aria-pressed]="showPassword"
            [attr.aria-controls]="'password'"
          >
            <i class="ri-eye-line" *ngIf="!showPassword" aria-hidden="true"></i>
            <i class="ri-eye-off-line" *ngIf="showPassword" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="submit-btn" [disabled]="loginForm.invalid">
        Se connecter
      </button>
    </form>

    <!-- Lien mot de passe oublié -->
    <div class="forgot-password-container">
      <a href="/mot-de-passe-oublie" class="forgot-password">
        <i class="ri-lock-unlock-line"></i>
        Mot de passe oublié ?
      </a>
    </div>
  </div>
</div>
