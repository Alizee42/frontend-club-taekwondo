<div class="reset-container">
  <div class="reset-card">
    <div class="card-header">
      <h1>Mot de passe oublié</h1>
      <p>Saisissez votre adresse email pour recevoir un lien de réinitialisation</p>
    </div>

    <!-- Formulaire de demande -->
    <form (ngSubmit)="onSubmit()" #resetForm="ngForm" *ngIf="!isSuccess">
      <div class="form-group">
        <label for="email">Adresse email</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          required
          email
          placeholder="votre@email.com"
          [disabled]="loading"
          autocomplete="email"
        />
      </div>

      <ui-button
        type="submit"
        variant="primary"
        [full]="true"
        [label]="loading ? 'Envoi en cours...' : 'Envoyer le lien'"
        [loading]="loading"
        [disabled]="!!resetForm.invalid || loading"
      />
    </form>

    <!-- Message de succès simplifié -->
    <div class="success-compact" *ngIf="isSuccess">
      <i class="ri-check-circle-line success-icon"></i>
      <div class="success-content">
        <h3>Email envoyé avec succès</h3>
        <p>Vérifiez votre boîte de réception et vos courriers indésirables pour le lien de réinitialisation. Le lien expirera dans 24 heures.</p>
      </div>
    </div>

    <!-- Messages d'erreur -->
    <div class="error-message" *ngIf="isError">
      <i class="ri-error-warning-line"></i>
      {{ message }}
    </div>

    <!-- Liens de navigation -->
    <div class="links-container">
      <ui-button
        type="button"
        variant="ghost"
        icon="ri-arrow-left-line"
        label="Retour à la connexion"
        (clicked)="goToLogin()"
      />
    </div>
  </div>
</div>
