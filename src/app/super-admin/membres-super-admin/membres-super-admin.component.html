<div class="page-shell">
  <app-page-header title="Gestion des membres" icon="ri-group-line" subtitle="Membres du club sélectionné">
    <ng-container page-header-actions>
      <ui-button label="Exporter" icon="ri-file-download-line" (clicked)="exportCSV()" variant="secondary"></ui-button>
      <ui-button label="Ajouter un membre" (clicked)="openAjoutModal()" variant="primary" [disabled]="!selectedClubId"></ui-button>
    </ng-container>
  </app-page-header>
  <ui-kpi-grid [cols]="3">
    <ui-kpi-card icon="ri-group-line"       label="Membres"            [value]="nbMembres" tone="primary" [loading]="loading"></ui-kpi-card>
    <ui-kpi-card icon="ri-building-4-line"  label="Clubs disponibles"  [value]="nbClubs"   tone="blue"   [loading]="loading"></ui-kpi-card>
    <ui-kpi-card icon="ri-filter-line"      label="Club sélectionné"   [value]="selectedClubId ? 1 : 0" [tone]="selectedClubId ? 'success' : 'neutral'"></ui-kpi-card>
  </ui-kpi-grid>

  <div *ngIf="error" class="error">{{ error }}</div>
  <div class="table-wrap">
    <ui-table
      *ngIf="selectedClubId"
      [columns]="columns"
      [data]="membres"
      [actions]="actions"
      (actionClick)="onTableAction($event)">
    </ui-table>
  </div>
</div>

<ui-modal [open]="showModal" [title]="modalMode === 'ajout' ? 'Ajouter un membre' : 'Modifier le membre'" (closed)="closeModal()">
  <app-membres-super-admin-form
    [membre]="membreEnCours"
    [clubId]="selectedClubId"
    (submitForm)="onSubmitForm($event)"
    (cancel)="closeModal()">
  </app-membres-super-admin-form>
</ui-modal>
