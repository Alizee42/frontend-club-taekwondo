<div class="page-shell">
  <app-page-header title="Gestion des membres" icon="ri-group-line" subtitle="Membres du club sélectionné">
    <ng-container page-header-actions>
      <ui-button label="Ajouter un membre" (clicked)="openAjoutModal()" variant="primary" [disabled]="!selectedClubId"></ui-button>
    </ng-container>
  </app-page-header>
  <div class="filters-bar">
    <select class="form-select" [(ngModel)]="selectedClubId" (ngModelChange)="onSelectClub($event)">
      <option [ngValue]="null">-- Choisir un club --</option>
      <option *ngFor="let c of clubs" [ngValue]="c.id">{{ c.nom || c.name }}</option>
    </select>
    <div *ngIf="!clubs || clubs.length === 0" class="info">Aucun club disponible.</div>
  </div>
  <div *ngIf="error" class="error">{{ error }}</div>
  <div class="table-wrap">
    <ui-table
      *ngIf="selectedClubId"
      [columns]="columns"
      [data]="membres"
      [actions]="actions"
      (actionClick)="onTableAction($event)">
    </ui-table>
  </div>
</div>

<ui-modal [open]="showModal" [title]="modalMode === 'ajout' ? 'Ajouter un membre' : 'Modifier le membre'" (closed)="closeModal()">
  <app-membres-super-admin-form
    [membre]="membreEnCours"
    (submitForm)="onSubmitForm($event)"
    (cancel)="closeModal()">
  </app-membres-super-admin-form>
</ui-modal>
