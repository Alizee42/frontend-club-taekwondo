<div class="page-shell">
  <app-page-header title="Gestion des utilisateurs" icon="ri-user-line" subtitle="Créer et gérer les comptes utilisateurs">
    <ng-container page-header-actions>
      <ui-button icon="ri-user-add-line" label="Ajouter un utilisateur" (clicked)="onAddUtilisateur()" variant="primary"></ui-button>
    </ng-container>
  </app-page-header>
  <ui-kpi-grid [cols]="3">
    <ui-kpi-card icon="ri-group-line"       label="Utilisateurs"  [value]="nbUtilisateurs" tone="primary"></ui-kpi-card>
    <ui-kpi-card icon="ri-shield-user-line" label="Admins"        [value]="nbAdmins"       tone="purple"></ui-kpi-card>
    <ui-kpi-card icon="ri-user-line"        label="Membres"       [value]="nbMembres"      tone="blue"></ui-kpi-card>
  </ui-kpi-grid>

  <div class="table-wrap">
    <ui-table
      [columns]="columns"
      [data]="utilisateurs"
      [actions]="actions"
      (actionClick)="onTableAction($event)">
    </ui-table>
  </div>
</div>

<ui-modal [open]="showModal" [title]="mode === 'ajout' ? 'Ajouter un utilisateur' : 'Modifier l\'utilisateur'" (closed)="onCancelForm()">
  <app-utilisateur-form
    [utilisateur]="utilisateurEnCours"
    [mode]="mode"
    [clubs]="clubs"
    (submitForm)="onSubmitForm($event)"
    (cancel)="onCancelForm()">
  </app-utilisateur-form>
</ui-modal>
