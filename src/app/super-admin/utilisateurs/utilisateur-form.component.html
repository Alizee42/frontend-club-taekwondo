<form #form="ngForm" class="utilisateur-form">
  <div class="form-group">
    <label>Nom <span class="required-mark">*</span></label>
    <input type="text" [(ngModel)]="utilisateur.nom" name="nom" required />
  </div>

  <div class="form-group">
    <label>Prénom <span class="required-mark">*</span></label>
    <input type="text" [(ngModel)]="utilisateur.prenom" name="prenom" required />
  </div>
  <div class="form-group">
    <label>Email <span class="required-mark">*</span></label>
    <input type="email" [(ngModel)]="utilisateur.email" name="email" required />
  </div>
  <div class="form-group">
    <label>Rôle <span class="required-mark">*</span></label>
    <select [(ngModel)]="utilisateur.role" name="role" required [disabled]="mode === 'edition'">
      <option *ngFor="let r of roles" [value]="r">{{ r }}</option>
    </select>
    <span *ngIf="mode === 'edition'" class="field-hint">Le rôle ne peut pas être modifié.</span>
  </div>
  <div class="form-group">
    <label>Club <span class="required-mark">*</span></label>
    <select [(ngModel)]="utilisateur.clubId" name="clubId" required>
      <option value="">Sélectionner un club</option>
      <option *ngFor="let c of clubs" [value]="c.id">{{ c.nom || c.name }}</option>
    </select>
    <ui-button
      type="button"
      variant="secondary"
      size="sm"
      customClass="ms-auto"
      label="Rafraîchir la liste des clubs"
      (clicked)="refreshClubs()"
    />
  </div>

  <div *ngIf="mode === 'ajout'" class="form-group">
    <label>Mot de passe (optionnel)</label>
    <input type="password" [(ngModel)]="utilisateur.password" name="password" minlength="6" placeholder="Laisser vide pour envoyer un email de définition" />
    <span class="field-hint">Si laissé vide, l'utilisateur recevra un email pour définir son mot de passe avant sa première connexion.</span>
  </div>
</form>

<div class="form-actions">
  <ui-button type="button" variant="ghost" label="Annuler" (clicked)="cancel.emit()" />
  <ui-button type="button" variant="primary" icon="ri-save-line" label="Valider" [disabled]="!!form.invalid" (clicked)="onSubmit()" />
</div>
