<div class="page-shell">
  <app-page-header title="Gestion des clubs" icon="ri-building-4-line">
    <ng-container page-header-actions>
      <ui-button variant="primary" (clicked)="openClubModal = true" label="Créer un club"></ui-button>
    </ng-container>
  </app-page-header>
  <div class="table-wrap">
    <ui-table
      [columns]="clubColumns"
      [data]="clubs"
      [actions]="clubActions"
      (actionClick)="handleClubAction($event)">
    </ui-table>
  </div>
</div>

<ui-modal [open]="openClubModal" [title]="selectedClub ? 'Modifier le club' : 'Créer un nouveau club'" (closed)="closeClubModal()">
  <ui-form
    [fields]="clubFormFields"
    [model]="selectedClub || newClub"
    [submitLabel]="selectedClub ? 'Enregistrer' : 'Créer'"
    (submitted)="onClubFormSubmit($event)">
  </ui-form>
</ui-modal>
