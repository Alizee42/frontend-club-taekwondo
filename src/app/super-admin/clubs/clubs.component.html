<h2>Gestion des clubs</h2>

<section class="clubs-list">
	<h3>Clubs existants</h3>
	<div *ngIf="loading">Chargement...</div>
	<ul *ngIf="!loading">
		<li *ngFor="let club of clubs">
			<strong>{{ club.name }}</strong>
			<div class="meta">{{ club.adresse || '' }} - {{ club.telephone || '' }} - {{ club.email || '' }}</div>
		</li>
	</ul>
</section>

<section class="clubs-create">
	<h3>Créer un nouveau club</h3>
	<form (ngSubmit)="createClub()">
		<div>
			<label>Nom</label>
			<input [(ngModel)]="newClub.name" name="name" required />
		</div>
		<div>
			<label>Adresse</label>
			<input [(ngModel)]="newClub.adresse" name="adresse" />
		</div>
		<div>
			<label>Téléphone</label>
			<input [(ngModel)]="newClub.telephone" name="telephone" />
		</div>
		<div>
			<label>Email</label>
			<input [(ngModel)]="newClub.email" name="email" />
		</div>
		<div>
			<label>Logo (URL)</label>
			<input [(ngModel)]="newClub.logo" name="logo" />
		</div>
		<button type="submit">Créer le club</button>
	</form>
</section>
