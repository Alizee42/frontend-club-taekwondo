
<section class="clubs-page-premium">
  <div class="clubs-header-premium" style="display: flex; align-items: center; justify-content: space-between; gap: 18px;">
    <h2 class="clubs-title" style="margin: 0;">Gestion des clubs</h2>
  <ui-button color="primary" (clicked)="openClubModal = true" label="Créer un club" class="ui-btn"></ui-button>
  </div>
  <div class="clubs-table-wrapper">
    <ui-table
      [columns]="clubColumns"
      [data]="clubs"
      [actions]="clubActions"
      (actionClick)="handleClubAction($event)">
    </ui-table>
  </div>
  <ui-modal [open]="openClubModal" [title]="selectedClub ? 'Modifier le club' : 'Créer un nouveau club'" (closed)="closeClubModal()">
    <ui-form
      [fields]="clubFormFields"
      [model]="selectedClub || newClub"
      [submitLabel]="selectedClub ? 'Enregistrer' : 'Créer'"
      (submitted)="onClubFormSubmit($event)">
    </ui-form>
  </ui-modal>
</section>
