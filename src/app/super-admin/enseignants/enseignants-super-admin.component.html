<div class="page-shell">
  <app-page-header title="Gestion des enseignants" icon="ri-user-star-line">
    <ng-container page-header-actions>
      <ui-button label="Ajouter un enseignant" icon="ri-add-line" variant="primary" (clicked)="openCreateModal()" [disabled]="!selectedClubId"></ui-button>
    </ng-container>
  </app-page-header>
  <ui-kpi-grid [cols]="3">
    <ui-kpi-card icon="ri-user-star-line"   label="Enseignants"       [value]="nbEnseignants" tone="primary" [loading]="loading"></ui-kpi-card>
    <ui-kpi-card icon="ri-building-4-line"  label="Clubs disponibles" [value]="nbClubs"       tone="blue"   [loading]="loading"></ui-kpi-card>
    <ui-kpi-card icon="ri-filter-line"      label="Club sélectionné"  [value]="selectedClubId ? 1 : 0" [tone]="selectedClubId ? 'success' : 'neutral'"></ui-kpi-card>
  </ui-kpi-grid>

  <div class="filters-bar">
    <select class="form-select" [(ngModel)]="selectedClubId" (change)="onClubChange()">
      <option *ngFor="let c of clubs" [value]="c.id">{{ c.name || c.nom }}</option>
    </select>
  </div>
  <div class="table-wrap">
    <ui-table
      [columns]="columns"
      [data]="enseignants"
      [actions]="actions"
      (actionClick)="handleAction($event)">
    </ui-table>
  </div>
</div>

<ui-modal [open]="openModal" [title]="selected ? 'Modifier un enseignant' : 'Ajouter un enseignant'" (closed)="openModal=false">
  <div class="modal-scroll">
    <div class="photo-preview" *ngIf="photoPreviewUrl || form.photoUrl">
      <img [src]="photoPreviewUrl || toFullImageUrl(form.photoUrl)" alt="Prévisualisation" />
      <div class="uploading" *ngIf="uploadingPhoto">Téléversement…</div>
    </div>
    <ui-form
      [title]="selected ? 'Éditer' : 'Créer'"
      [fields]="formFields"
      [model]="form"
      submitLabel="Enregistrer"
      (submitted)="onFormSubmit($event)">
    </ui-form>
  </div>
</ui-modal>
