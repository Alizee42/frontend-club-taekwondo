<div class="horaires-global">
  <div class="header-horaires">
    <div class="header-top">
      <ui-title [level]="1" text="Gestion des horaires des clubs"></ui-title>
      <div class="ajout-horaires-btn-container">
        <ui-button label="Ajouter des horaires" variant="primary" (clicked)="showAjoutModal = true" customClass="ajout-horaires-btn"></ui-button>
      </div>
    </div>
    <div class="header-controls">
      <label for="club-select" class="label-club-select">Club :</label>
      <select id="club-select" [(ngModel)]="selectedClubId" (change)="onClubChange()" class="club-select">
        <option *ngFor="let club of clubs" [value]="club.id">{{ club.name }}</option>
      </select>
    </div>
  </div>

  <!-- Modale déplacée en dehors du header pour ne pas casser l'alignement -->
  <ui-modal [open]="showAjoutModal" title="Ajouter un horaire" (closed)="showAjoutModal = false">
  <form class="ajout-horaire ajout-horaire-vertical" (ngSubmit)="ajoutFormValid && addHoraire()" #ajoutForm="ngForm">
        <label for="jour">Jour :</label>
  <select id="jour" required [(ngModel)]="ajoutJour" name="jour" (change)="openedPlageIndex = 0" class="select-jour">
          <option value="">-- Sélectionner --</option>
          <option value="Lundi">Lundi</option>
          <option value="Mardi">Mardi</option>
          <option value="Mercredi">Mercredi</option>
          <option value="Jeudi">Jeudi</option>
          <option value="Vendredi">Vendredi</option>
          <option value="Samedi">Samedi</option>
          <option value="Dimanche">Dimanche</option>
        </select>
  <div *ngIf="ajoutJour && ajoutPlages.length > 0" class="plages-scrollable" [class.scrollable]="ajoutPlages.length > 1">
          <ng-container *ngFor="let plage of ajoutPlages; let i = index">
            <fieldset class="bloc-plage-ajout" [class.closed]="openedPlageIndex !== i">
              <legend class="legend-plage-ajout">
                <span (click)="openedPlageIndex = (openedPlageIndex === i ? -1 : i)" class="toggle-plage">
                  Horaire n°{{i+1}}
                  <span *ngIf="openedPlageIndex !== i" style="font-weight:400;color:#37474f;font-size:0.98em;margin-left:1em;">
                    <span *ngIf="plage.plage">{{ plage.plage }}</span>
                    <span *ngIf="plage.groupe"> | {{ plage.groupe }}</span>
                    <span *ngIf="plage.adresse || plage.codePostal || plage.ville"> | {{ plage.adresse }}<span *ngIf="plage.codePostal"> {{ plage.codePostal }}</span><span *ngIf="plage.ville"> {{ plage.ville }}</span></span>
                  </span>
                </span>
                <button type="button" (click)="$event.stopPropagation(); editPlageForm(i)" class="edit-horaire-btn modal" title="Modifier cette plage">
                  <i class="ri-edit-2-line" style="font-size:1.3em;color:white;"></i>
                </button>
                <button type="button" (click)="$event.stopPropagation(); removePlageForm(i)" class="delete-horaire-btn modal" title="Supprimer cette plage">
                  <i class="ri-delete-bin-6-line" style="font-size:1.3em;color:white;"></i>
                </button>
                <span class="icon-toggle">
                  <svg *ngIf="openedPlageIndex === i" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="#1976d2" stroke-width="2" stroke-linecap="round"/></svg>
                  <svg *ngIf="openedPlageIndex !== i" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 15l6-6 6 6" stroke="#1976d2" stroke-width="2" stroke-linecap="round"/></svg>
                </span>
              </legend>
              <div *ngIf="openedPlageIndex === i" class="plage-ajout-fields">
                <label class="label-field">Plage horaire :</label>
                <select required [(ngModel)]="plage.plage" name="plage{{i}}" class="select-plage">
                  <option value="">-- Sélectionner --</option>
                  <option value="8h - 9h">8h - 9h</option>
                  <option value="9h - 10h">9h - 10h</option>
                  <option value="10h - 11h">10h - 11h</option>
                  <option value="11h - 12h">11h - 12h</option>
                  <option value="14h - 15h">14h - 15h</option>
                  <option value="15h - 16h">15h - 16h</option>
                  <option value="16h - 17h">16h - 17h</option>
                  <option value="17h - 18h">17h - 18h</option>
                  <option value="18h - 19h">18h - 19h</option>
                  <option value="19h - 20h">19h - 20h</option>
                  <option value="20h - 21h">20h - 21h</option>
                </select>
                <label class="label-field">Groupe concerné :</label>
                <input type="text" [(ngModel)]="plage.groupe" name="groupe{{i}}" placeholder="Ex : Enfants, Adultes..." class="input-field">
                <div *ngIf="i > 0" class="meme-adresse-checkbox">
                  <input type="checkbox" [(ngModel)]="plage.memeAdresse" name="memeAdresse{{i}}" (change)="onMemeAdresseChange(plage, ajoutPlages)">
                  <label class="label-checkbox">Même adresse que le premier horaire</label>
                </div>
                <label class="label-field">Adresse :</label>
                <input type="text" [(ngModel)]="plage.adresse" name="adresse{{i}}" placeholder="Adresse du cours" class="input-field">
                <label class="label-field">Code postal :</label>
                <input type="text" [(ngModel)]="plage.codePostal" name="codePostal{{i}}" placeholder="Code postal" class="input-field">
                <label class="label-field">Ville :</label>
                <input type="text" [(ngModel)]="plage.ville" name="ville{{i}}" placeholder="Ville" class="input-field">
                <button type="button" (click)="$event.stopPropagation(); editPlageForm(i)" class="edit-horaire-btn absolute" title="Modifier cette plage">
                  <i class="ri-edit-2-line" style="font-size:1.3em;color:white;"></i>
                </button>
                <button type="button" (click)="removePlageForm(i)" class="delete-horaire-btn absolute" title="Supprimer cette plage">
                  <i class="ri-delete-bin-6-line" style="font-size:1.3em;color:white;"></i>
                </button>
              </div>
            </fieldset>
          </ng-container>
          <div class="ajout-plage-actions">
            <ui-button label="Ajouter une plage horaire" variant="primary" (clicked)="addPlageForm()" customClass="ajout-plage-btn"></ui-button>
            <ui-button type="submit" label="Valider" variant="primary" [disabled]="!ajoutFormValid" customClass="valider-btn"></ui-button>
          </div>
          <div *ngIf="!ajoutFormValid" class="ajout-form-error">
            Veuillez remplir tous les champs pour chaque plage horaire.
          </div>
        </div>
      </form>
    </ui-modal>
  

  <div class="horaires-cards-container">
    <div *ngIf="horaires.length === 0" class="no-horaires">Aucun horaire pour ce club.</div>
    <div *ngIf="horairesParJour.length === 0" class="no-horaires">Aucun horaire pour ce club.</div>
    <div class="accordion-horaires">
      <div *ngFor="let jourBlock of horairesParJour; let i = index" class="accordion-item">
  <div class="accordion-header" (click)="openedPlageIndex = (openedPlageIndex === i ? -1 : i)" [ngClass]="{ 'open': openedPlageIndex === i }">
          <span class="accordion-jour">{{ jourBlock.jour }}</span>
          <button class="ajout-plage-jour-btn" (click)="$event.stopPropagation(); openAjoutPlageModal(jourBlock.jour)">
            Ajouter plage horaire
          </button>
          <span class="icon-toggle">
            <svg *ngIf="openedPlageIndex === i" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="#1976d2" stroke-width="2" stroke-linecap="round"/></svg>
            <svg *ngIf="openedPlageIndex !== i" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 15l6-6 6 6" stroke="#1976d2" stroke-width="2" stroke-linecap="round"/></svg>
          </span>
        </div>
  <div class="accordion-body" *ngIf="openedPlageIndex === i">
          <ui-table
            [columns]="[
              { key: 'heureDebut', label: 'Début' },
              { key: 'heureFin', label: 'Fin' },
              { key: 'groupe', label: 'Groupe' },
              { key: 'adresse', label: 'Adresse' }
            ]"
            [data]="jourBlock.horaires"
            [actions]="[
              { label: 'Éditer', icon: 'ri-edit-2-line', action: 'edit', color: '#1976d2' },
              { label: 'Supprimer', icon: 'ri-delete-bin-6-line', action: 'delete', color: '#e53935' }
            ]"
            (actionClick)="onTableAction($event)"
          ></ui-table>
        </div>
</div>

<!-- Modale d'ajout de plage pour un jour donné -->
<ui-modal [open]="showAjoutPlageModal" title="Ajouter une plage horaire" (closed)="closeAjoutPlageModal()">
  <form (ngSubmit)="submitAjoutPlageModal()" #ajoutPlageForm="ngForm" class="ajout-plage-form">
  <div class="ajout-plage-jour">Jour : {{ jourAjoutPlage }}</div>
    <label>Plage horaire :</label>
  <select required [(ngModel)]="ajoutPlageData.plage" name="plage" class="select-plage">
      <option value="">-- Sélectionner --</option>
      <option value="8h - 9h">8h - 9h</option>
      <option value="9h - 10h">9h - 10h</option>
      <option value="10h - 11h">10h - 11h</option>
      <option value="11h - 12h">11h - 12h</option>
      <option value="14h - 15h">14h - 15h</option>
      <option value="15h - 16h">15h - 16h</option>
      <option value="16h - 17h">16h - 17h</option>
      <option value="17h - 18h">17h - 18h</option>
      <option value="18h - 19h">18h - 19h</option>
      <option value="19h - 20h">19h - 20h</option>
      <option value="20h - 21h">20h - 21h</option>
    </select>
    <label>Groupe :</label>
  <input type="text" [(ngModel)]="ajoutPlageData.groupe" name="groupe" placeholder="Groupe" required class="input-field">
    <label>Adresse :</label>
  <input type="text" [(ngModel)]="ajoutPlageData.adresse" name="adresse" placeholder="Adresse" required class="input-field">
    <label>Code postal :</label>
  <input type="text" [(ngModel)]="ajoutPlageData.codePostal" name="codePostal" placeholder="Code postal" required class="input-field">
    <label>Ville :</label>
  <input type="text" [(ngModel)]="ajoutPlageData.ville" name="ville" placeholder="Ville" required class="input-field">
  <div class="ajout-plage-modal-actions">
      <ui-button type="submit" label="Ajouter" variant="primary" [disabled]="!ajoutPlageForm.form.valid"></ui-button>
      <ui-button type="button" label="Annuler" variant="danger" (clicked)="closeAjoutPlageModal()"></ui-button>
    </div>
  </form>
</ui-modal>
      </div>
    </div>
