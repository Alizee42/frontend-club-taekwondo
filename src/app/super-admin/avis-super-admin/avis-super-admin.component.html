<section class="avis-section">
  <div class="header-flex">
    <ui-title [level]="2" text="Gestion des avis"></ui-title>
    <div class="add-btn">
      <ui-button label="Ajouter un avis" (clicked)="openAjoutModal()" variant="primary" [disabled]="!selectedClubId"></ui-button>
    </div>
  </div>
  <div class="club-select club-select-below">
    <label for="club-select">Sélectionnez un club :</label>
    <select id="club-select" [(ngModel)]="selectedClubId" (ngModelChange)="onSelectClub($event)">
      <option [ngValue]="null">-- Choisir --</option>
      <option *ngFor="let c of clubs" [ngValue]="c.id">{{ c.nom || c.name }}</option>
    </select>
  </div>
  <div *ngIf="loading">Chargement...</div>
  <div *ngIf="error" class="error">{{ error }}</div>
  <div *ngIf="!clubs || clubs.length === 0" class="info">Aucun club disponible.</div>
  <!-- Table des avis -->
  <ui-table
    *ngIf="selectedClubId"
    [columns]="columns"
    [data]="avis"
    [actions]="actions"
    (actionClick)="onTableAction($event)"
  ></ui-table>
  <div *ngIf="selectedClubId && (!avis || avis.length === 0)">Aucun avis pour le moment.</div>
  <!-- Modale d'ajout/édition -->
  <ui-modal [open]="showModal" [title]="modalMode === 'ajout' ? 'Ajouter un avis' : 'Modifier l\'avis'" (closed)="closeModal()">
    <ui-form
      [fields]="fields"
      [model]="avisEnCours"
      (submit)="onSubmitForm($event)"
      (cancel)="closeModal()"
      [submitLabel]="modalMode === 'ajout' ? 'Ajouter' : 'Enregistrer'"
    ></ui-form>
  </ui-modal>
</section>
