<div class="page-shell">
  <app-page-header title="Gestion des avis" icon="ri-star-line">
    <ng-container page-header-actions>
      <ui-button label="Ajouter un avis" (clicked)="openAjoutModal()" variant="primary" [disabled]="!selectedClubId"></ui-button>
    </ng-container>
  </app-page-header>
  <ui-kpi-grid [cols]="4">
    <ui-kpi-card icon="ri-star-line"            label="Total avis"    [value]="nbAvis"       tone="primary" [loading]="loading"></ui-kpi-card>
    <ui-kpi-card icon="ri-checkbox-circle-line" label="Approuvés"     [value]="nbApprouves"  tone="success" [loading]="loading"></ui-kpi-card>
    <ui-kpi-card icon="ri-time-line"            label="En attente"    [value]="nbEnAttente"  [tone]="nbEnAttente > 0 ? 'warning' : 'neutral'" [loading]="loading"></ui-kpi-card>
    <ui-kpi-card icon="ri-star-half-line"       label="Note moyenne"  [value]="noteMoyenne"  tone="amber"   [loading]="loading"></ui-kpi-card>
  </ui-kpi-grid>

  <div *ngIf="error" class="error">{{ error }}</div>
  <div class="table-wrap">
    <ui-table
      *ngIf="selectedClubId"
      [columns]="columns"
      [data]="avis"
      [actions]="actions"
      (actionClick)="onTableAction($event)">
    </ui-table>
  </div>
</div>

<ui-modal [open]="showModal" [title]="modalMode === 'ajout' ? 'Ajouter un avis' : 'Modifier l\'avis'" (closed)="closeModal()">
  <ui-form
    [fields]="fields"
    [model]="avisEnCours"
    (submitted)="onSubmitForm($event)"
    (cancel)="closeModal()"
    [submitLabel]="modalMode === 'ajout' ? 'Ajouter' : 'Enregistrer'">
  </ui-form>
</ui-modal>
