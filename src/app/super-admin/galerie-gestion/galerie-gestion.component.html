<div class="page-shell">
  <app-page-header title="Gestion des galeries par club" icon="ri-image-line">
    <ng-container page-header-actions>
      <ui-button label="Ajouter une photo" variant="primary" (clicked)="openAddModal()"></ui-button>
    </ng-container>
  </app-page-header>
  <div class="filters-bar">
    <select class="form-select" [(ngModel)]="selectedClubId" (change)="onClubChange(selectedClubId)">
      <option *ngFor="let club of clubs" [value]="club.id">{{ club.nom || club.name }}</option>
    </select>
  </div>
  <div class="table-wrap">
    <ui-table
      [columns]="tableColumns"
      [data]="images"
      [actions]="tableActions"
      (actionClick)="handleTableAction($event)">
    </ui-table>
  </div>
</div>

<ui-modal [open]="modalOpen" [title]="modalTitle" (closed)="closeModal()">
  <form (ngSubmit)="submitImage()">
    <div class="form-group">
      <label for="titre">Titre</label>
      <input id="titre" type="text" [(ngModel)]="formImage.titre" name="titre" required />
    </div>
    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description" [(ngModel)]="formImage.description" name="description" rows="3"></textarea>
    </div>
    <div class="form-group">
      <label for="imageFile">Image</label>
      <input id="imageFile" type="file" #imageFileInput (change)="onFileSelected($event)" accept="image/*" />
      <img *ngIf="formImage.imageUrl" [src]="formImage.imageUrl" alt="Aperçu" class="upload-preview" />
    </div>
    <div class="modal-footer">
      <ui-button label="Enregistrer" type="submit" variant="primary"></ui-button>
    </div>
  </form>
</ui-modal>
