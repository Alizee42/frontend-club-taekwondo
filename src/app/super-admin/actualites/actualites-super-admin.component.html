<div class="page-shell">
  <app-page-header title="Gestion des actualités" icon="ri-newspaper-line">
    <ng-container page-header-actions>
      <ui-button label="Ajouter une actualité" (clicked)="openModal()" variant="primary" [disabled]="!clubIdSelectionne"></ui-button>
    </ng-container>
  </app-page-header>
  <div class="filters-bar">
    <select class="form-select" [(ngModel)]="clubIdSelectionne" (ngModelChange)="onClubChange()">
      <option [ngValue]="null">-- Choisir un club --</option>
      <option *ngFor="let c of clubs" [ngValue]="c.id">{{ c.nom || c.name }}</option>
    </select>
    <input type="text" class="form-input" placeholder="Rechercher..." [(ngModel)]="searchTerm" name="searchTerm" />
  </div>
  <div *ngIf="error" class="error">{{ error }}</div>
  <div class="table-wrap">
    <ui-table
      *ngIf="clubIdSelectionne"
      [columns]="columns"
      [data]="filteredActualites()"
      [actions]="actions"
      (actionClick)="onTableAction($event)">
    </ui-table>
  </div>
</div>

<ui-modal [open]="isModalOpen" [title]="actualite.id ? 'Modifier une actualité' : 'Nouvelle actualité'" (closed)="closeModal()">
  <ui-form
    [fields]="fieldsWithoutFeatured"
    [model]="actualite"
    (submitted)="onSubmitForm($event)"
    (cancel)="closeModal()"
    [submitLabel]="actualite.id ? 'Mettre à jour' : 'Ajouter'">
  </ui-form>
  <img *ngIf="imageFile" [src]="imagePreviewUrl" alt="Aperçu de l'image" class="upload-preview" />
</ui-modal>
