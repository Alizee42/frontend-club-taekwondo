<div class="actualites-super-admin">
	<ui-title [level]="2" text="Actualités (Super Admin)"></ui-title>
	<p class="desc">Gestion et publication des actualités globales.</p>
		<div class="actions-bar">
			<ui-button label="Ajouter une actualité" variant="primary" (clicked)="openAddModal()"></ui-button>
		</div>
		<ui-table [columns]="columns" [data]="actualites"></ui-table>

		<!-- Modale d'ajout -->
		<div class="modal-backdrop" *ngIf="showAddModal">
			<div class="modal-content">
				<h3>Ajouter une actualité</h3>
				<form (ngSubmit)="addActualite()">
					<input [(ngModel)]="newTitre" name="titre" required placeholder="Titre" class="input-modal" />
					<input [(ngModel)]="newAuteur" name="auteur" required placeholder="Auteur" class="input-modal" />
					<textarea [(ngModel)]="newContenu" name="contenu" required placeholder="Contenu" class="input-modal"></textarea>
					<div class="modal-actions">
						  <ui-button label="Annuler" variant="secondary" (clicked)="closeAddModal()" type="button"></ui-button>
						<ui-button label="Ajouter" variant="primary" type="submit"></ui-button>
					</div>
				</form>
			</div>
		</div>
</div>
