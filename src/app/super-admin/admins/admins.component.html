<div class="admins-root">
	<div class="header-row" style="display: flex; align-items: center; justify-content: space-between; gap: 18px;">
		<h2 style="margin: 0;">Administrateurs de clubs</h2>
		<ui-button label="Créer un admin" color="primary" (click)="showModal = true"></ui-button>
	</div>

	<ui-table
		[columns]="[
			{ key: 'nom', label: 'Nom' },
			{ key: 'prenom', label: 'Prénom' },
			{ key: 'email', label: 'Email' },
			{ key: 'clubName', label: 'Club' }
		]"
		[data]="adminsTable"
		[actions]="tableActions"
		(actionClick)="onTableAction($event)"
	></ui-table>
	<div *ngIf="admins.length === 0" class="empty-table">Aucun administrateur trouvé.</div>

	<ui-modal [open]="showModal" (closed)="showModal = false" [title]="'Créer un administrateur de club'">
	<form (ngSubmit)="createAdmin()" class="admin-form ui-form">
			<div class="row">
				<label>Nom *</label>
				<input [(ngModel)]="newAdmin.nom" name="nom" required />
			</div>
			<div class="row">
				<label>Prénom</label>
				<input [(ngModel)]="newAdmin.prenom" name="prenom" />
			</div>
			<div class="row">
				<label>Email *</label>
				<input [(ngModel)]="newAdmin.email" name="email" type="email" required />
			</div>
			<div class="row">
				<label>Mot de passe *</label>
				<input [(ngModel)]="newAdmin.password" name="password" type="password" required />
			</div>
			<div class="row">
				<label>Club *</label>
				<select [(ngModel)]="newAdmin.clubId" name="clubId" required>
					<option [ngValue]="null">-- Choisir un club --</option>
					<option *ngFor="let c of clubs" [ngValue]="c.id">{{ c.name }}</option>
				</select>
				<small *ngIf="clubs.length === 0" class="hint">Aucun club disponible — créez d'abord un club.</small>
			</div>

			<div class="actions" style="display: flex; justify-content: center;">
				<ui-button [type]="'submit'" [disabled]="loading" [label]="loading ? 'En cours...' : 'Créer'" color="primary" class="ui-form-submit"></ui-button>
			</div>

			<p class="message" *ngIf="message">{{ message }}</p>
		</form>
	</ui-modal>
</div>
