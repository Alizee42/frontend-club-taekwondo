<div class="page-shell">
  <app-page-header title="Administrateurs de clubs" icon="ri-shield-user-line">
    <ng-container page-header-actions>
      <ui-button label="Créer un admin" variant="primary" (clicked)="openCreateModal()"></ui-button>
    </ng-container>
  </app-page-header>
  <ui-kpi-grid [cols]="3">
    <ui-kpi-card icon="ri-shield-user-line"  label="Administrateurs"   [value]="nbAdmins"        tone="primary" [loading]="loading"></ui-kpi-card>
    <ui-kpi-card icon="ri-building-4-line"   label="Clubs couverts"    [value]="clubsCouvertIds" tone="blue"    [loading]="loading"></ui-kpi-card>
    <ui-kpi-card icon="ri-community-line"    label="Clubs total"       [value]="clubs.length"    tone="neutral" [loading]="loading"></ui-kpi-card>
  </ui-kpi-grid>

  <div class="table-wrap">
    <ui-table
      [columns]="[
        { key: 'nom', label: 'Nom' },
        { key: 'prenom', label: 'Prénom' },
        { key: 'email', label: 'Email' },
        { key: 'clubName', label: 'Club' }
      ]"
      [data]="adminsTable"
      [actions]="tableActions"
      (actionClick)="onTableAction($event)">
    </ui-table>
  </div>
</div>

<ui-modal [open]="showModal" (closed)="closeModal()" [title]="editingId ? 'Modifier l administrateur' : 'Créer un administrateur de club'">
  <form (ngSubmit)="createAdmin()" class="admin-form">
    <div class="form-group">
      <label>Nom *</label>
      <input [(ngModel)]="newAdmin.nom" name="nom" required />
    </div>
    <div class="form-group">
      <label>Prénom</label>
      <input [(ngModel)]="newAdmin.prenom" name="prenom" />
    </div>
    <div class="form-group">
      <label>Email *</label>
      <input [(ngModel)]="newAdmin.email" name="email" type="email" required />
    </div>
    <div class="form-group">
      <label>Mot de passe</label>
      <input [(ngModel)]="newAdmin.password" name="password" type="password" [placeholder]="editingId ? '(optionnel) laisser vide pour ne pas changer' : '(optionnel) sera défini par email'" />
    </div>
    <div class="form-group">
      <label>Club *</label>
      <select [(ngModel)]="newAdmin.clubId" name="clubId" required>
        <option [ngValue]="null">-- Choisir un club --</option>
        <option *ngFor="let c of clubs" [ngValue]="c.id">{{ c.name }}</option>
      </select>
      <small *ngIf="clubs.length === 0" class="hint">Aucun club disponible — créez d'abord un club.</small>
    </div>
    <p class="hint" *ngIf="!editingId">Un email sera envoyé au nouvel administrateur pour définir son mot de passe.</p>
    <p class="message" *ngIf="message">{{ message }}</p>
    <div class="modal-footer">
      <ui-button [type]="'submit'" [disabled]="loading" [label]="loading ? 'En cours...' : (editingId ? 'Enregistrer' : 'Créer')" variant="primary"></ui-button>
    </div>
  </form>
</ui-modal>
