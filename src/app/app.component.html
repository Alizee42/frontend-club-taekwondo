<!-- Header (affiché uniquement en dehors des routes connectées) -->
<ng-container *ngIf="!isConnectedRoute; else connectedHeader">
    <app-header></app-header>
  </ng-container>
  
  <!-- Header connecté (admin, membre ou profil) -->
  <ng-template #connectedHeader>
    <app-connected-header [role]="connectedRole"></app-connected-header>
  </ng-template>
  
  <!-- Contenu des routes -->
  <router-outlet></router-outlet>
  
  <!-- Footer (uniquement pour les pages publiques) -->
  <app-footer *ngIf="!isConnectedRoute"></app-footer>
