<ng-container>
  <universal-header
    [clubName]="selectedClub?.name || selectedClub?.nom || ''"
    [isUserLoggedIn]="isUserLoggedIn"
    [isDashboardRoute]="isDashboardRoute"
    [userName]="userName"
    [userAvatar]="userAvatar"
    [unreadNotifications]="unreadNotifications"
    [notifications]="notifications"
    [role]="role"
    [cartCount]="cartCount"
    (logout)="onLogout()"
    (changeClub)="onChangeClub()"
    (goToDashboard)="onGoToDashboard()"
    (markNotifRead)="onMarkNotifRead($event)"
    (markAllNotifsRead)="onMarkAllNotifsRead()"
  ></universal-header>

  <div class="club-picker-backdrop" *ngIf="showSelectClubModal" (click)="showSelectClubModal = false">
    <section class="club-picker-dialog" role="dialog" aria-modal="true" aria-labelledby="clubPickerTitle" (click)="$event.stopPropagation()">
      <button class="club-picker-close" type="button" (click)="showSelectClubModal = false" aria-label="Fermer">
        <i class="ri-close-line" aria-hidden="true"></i>
      </button>

      <header class="club-picker-header">
        <span class="club-picker-mark">OT</span>
        <div>
          <p class="club-picker-kicker">Olympique Taekwondo</p>
          <h2 id="clubPickerTitle">Choisissez votre ville</h2>
          <p class="club-picker-text">
            Votre club Olympique Taekwondo, dans votre ville.
          </p>
        </div>
      </header>

      <div class="club-picker-body">
        <app-club-select
          (clubSelected)="onClubSelected($event)"
          (closeModal)="showSelectClubModal = false">
        </app-club-select>
      </div>
    </section>
  </div>

  <router-outlet></router-outlet>
  <app-footer></app-footer>
  <app-toast-container></app-toast-container>
</ng-container>
