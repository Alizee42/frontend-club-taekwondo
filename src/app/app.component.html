<!-- Header conditionnel -->
<ng-container *ngIf="isConnectedRoute; else publicHeader">
	<app-connected-header></app-connected-header>
</ng-container>
<ng-template #publicHeader>
	<app-header></app-header>
</ng-template>

<!-- Contenu principal -->
<router-outlet></router-outlet>

<!-- Footer affiché uniquement sur les pages publiques -->
<app-footer *ngIf="!isConnectedRoute"></app-footer>

<!-- Container global pour les toasts (visible partout) -->
<app-toast-container></app-toast-container>
