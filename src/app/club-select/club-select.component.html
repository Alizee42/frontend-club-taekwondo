
<div class="club-modal-premium-select">
  <div *ngIf="loading" class="club-modal-loading">Chargement des clubs...</div>
  <div *ngIf="error" class="club-modal-error">{{ error }}</div>
  <div class="club-modal-list" *ngIf="!loading && clubs.length > 0">
    <button class="club-modal-premium-btn" *ngFor="let club of clubs" (click)="selectClub(club)">
      <span class="club-modal-btn-label">{{ club.name }}</span>
    </button>
  </div>
  <div *ngIf="!loading && clubs.length === 0 && !error" class="club-modal-empty">Aucun club disponible.</div>
</div>
