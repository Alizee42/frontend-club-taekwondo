<div class="club-select">
  <div *ngIf="loading" class="club-state">
    <span class="club-spinner"></span>
    Chargement des villes...
  </div>

  <div *ngIf="error" class="club-state club-state--error">
    <i class="ri-error-warning-line"></i>
    {{ error }}
  </div>

  <div class="club-grid" *ngIf="!loading && clubs.length > 0">
    <button
      *ngFor="let club of clubs"
      type="button"
      class="club-card"
      (click)="selectClub(club)">
      <span class="club-card__logo">
        <img *ngIf="club.logo" [src]="club.logo" [alt]="club.name || club.nom">
        <i *ngIf="!club.logo" class="ri-map-pin-2-line"></i>
      </span>
      <span class="club-card__content">
        <strong>{{ club.name || club.nom }}</strong>
        <small *ngIf="club.adresse">{{ club.adresse }}</small>
        <span *ngIf="club.telephone"><i class="ri-phone-line"></i>{{ club.telephone }}</span>
      </span>
      <i class="ri-arrow-right-line club-card__arrow" aria-hidden="true"></i>
    </button>
  </div>

  <div *ngIf="!loading && clubs.length === 0 && !error" class="club-state">
    Aucun club disponible.
  </div>
</div>
