<header class="universal-header">
  <div class="logo">
    <a routerLink="/">
      <span class="brand-strong">Olympique</span>
      <span class="brand-mid">Taekwondo</span>
      <span class="brand-thin">{{ clubName }}</span>
    </a>
    <button *ngIf="!isUserLoggedIn" class="change-club-btn" (click)="changeClub.emit()" title="Changer de club">Changer de club</button>
  </div>

  <nav class="nav-wrapper">
    <ul class="main-nav">
  <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Accueil</a></li>
  <li><a routerLink="/galerie" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Galerie</a></li>
  <li><a routerLink="/inscription" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Inscription</a></li>
  <li><a routerLink="/boutique" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Boutique</a></li>
  <li><a routerLink="/evenements" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Événements</a></li>
  <li><a routerLink="/contact" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Contact</a></li>
  <li><a routerLink="/connexion" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Connexion</a></li>
    </ul>
  </nav>
</header>
