<button
  class="ui-icn-btn"
  [ngClass]="'v-' + variant"
  [disabled]="disabled || loading"
  [attr.aria-label]="ariaLabel || icon"
  [attr.title]="title || ariaLabel || icon"
  (click)="onClick($event)"
>
  <span class="spinner" *ngIf="loading" aria-hidden="true"></span>
  <i *ngIf="!loading" [class]="icon" aria-hidden="true"></i>
</button>
