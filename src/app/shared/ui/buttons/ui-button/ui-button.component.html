<button
  class="ui-btn"
  [ngClass]="[variant, customClass]"
  [disabled]="disabled || loading"
  (click)="onClick()"
  [attr.type]="type"
>
  <ui-icon-button *ngIf="icon" [icon]="icon" [variant]="variant" [disabled]="disabled || loading"></ui-icon-button>
  <span class="ui-btn-label">{{ label }}</span>
  <span *ngIf="loading" class="spinner"></span>
</button>
