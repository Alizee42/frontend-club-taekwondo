<div
  class="alert-banner"
  [ngClass]="'alert-banner--' + type"
  [attr.role]="role"
>
  <div class="alert-banner__icon" aria-hidden="true">
    <i [class]="resolvedIcon"></i>
  </div>

  <div class="alert-banner__content">
    <strong *ngIf="title" class="alert-banner__title">{{ title }}</strong>
    <p *ngIf="message" class="alert-banner__message">{{ message }}</p>
    <ng-content></ng-content>
  </div>

  <div class="alert-banner__actions">
    <ng-content select="[alert-actions]"></ng-content>
  </div>

  <button
    *ngIf="dismissible"
    class="alert-banner__close"
    type="button"
    aria-label="Fermer l’alerte"
    (click)="dismiss()"
  >
    <i class="ri-close-line" aria-hidden="true"></i>
  </button>
</div>
