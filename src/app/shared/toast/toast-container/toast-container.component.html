<div class="toast-stack">
  <div
    *ngFor="let toast of (toasts$ | async); trackBy: trackById"
    class="message-box"
    [ngClass]="'message-box-' + normalizeType(toast.type)"
    [class.leaving]="toast.leaving"
    [attr.role]="normalizeType(toast.type) === 'error' ? 'alert' : 'status'"
    [attr.aria-live]="normalizeType(toast.type) === 'error' ? 'assertive' : 'polite'"
  >
    <div class="toast-icon" aria-hidden="true">
      <i [class]="getIconClass(toast.type)"></i>
    </div>

    <span class="message-text">{{ toast.message }}</span>

    <button
      *ngIf="toast.dismissible"
      class="exit-button"
      type="button"
      (click)="$event.stopPropagation(); removeToast(toast.id)"
      aria-label="Fermer"
    >
      <i class="ri-close-line" aria-hidden="true"></i>
    </button>

    <div
      *ngIf="toast.duration > 0"
      class="toast-progress"
      [style.animation-duration]="getProgressDuration(toast)"
    ></div>
  </div>
</div>
