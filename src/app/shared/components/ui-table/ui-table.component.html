<table class="ui-table">
  <thead>
    <tr>
      <th *ngFor="let col of columns">{{ col.label }}</th>
      <th *ngIf="actions.length">Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let row of data">
      <td *ngFor="let col of columns" [ngClass]="col.cellClass">
        <!-- Si la colonne est de type image, on rend un <img> sécurisé -->
        <ng-container *ngIf="col.type === 'image'">
          <img [src]="row[col.key]" alt="{{ row[col.key] ? 'photo' : 'Aucune image' }}" class="galerie-table-img" *ngIf="row[col.key]; else noImg" />
          <ng-template #noImg><span style="color:#888">Aucune image</span></ng-template>
        </ng-container>

        <!-- Si la colonne est custom et que render existe, on affiche le texte renvoyé (sécurisé) -->
        <ng-container *ngIf="col.type !== 'image'">
          <span *ngIf="!col.render">{{ row[col.key] }}</span>
          <span *ngIf="col.render">{{ col.render(row) }}</span>
        </ng-container>
      </td>
      <td *ngIf="actions.length">
        <div style="display: flex; gap: 8px; align-items: center; justify-content: flex-start;">
          <button *ngFor="let act of actions"
            class="ui-table-actions-btn"
            [ngClass]="{ 'edit': act.action === 'edit' }"
            [ngStyle]="{ color: act.color || '#2563eb' }"
            (click)="onAction(act.action, row)"
            style="padding: 0 8px; min-width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;">
            <i *ngIf="act.icon" [class]="act.icon" style="font-size: 1.3em;">
              {{ act.iconText || '' }}
            </i>
          </button>
        </div>
      </td>
    </tr>
  </tbody>
</table>
