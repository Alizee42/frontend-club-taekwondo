<table class="ui-table">
  <thead>
    <tr>
      <th *ngFor="let col of columns"
          [ngStyle]="col.width ? {'width': col.width, 'min-width': col.width, 'max-width': col.width} : {}"
          [ngClass]="col.headerClass">
        {{ col.label }}
      </th>
  <th *ngIf="actions.length" style="width:80px;min-width:80px;padding:0 6px;text-align:center;">Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let row of data">
    <td *ngFor="let col of columns" [ngClass]="col.cellClass"
      [ngStyle]="col.width ? {'width': col.width, 'min-width': col.width, 'max-width': col.width} : {}">
        <ng-container *ngIf="col.type === 'image'">
          <img [src]="row[col.key]" alt="photo" class="galerie-table-img" *ngIf="row[col.key]; else noImg" />
          <ng-template #noImg><span style="color:#888">Aucune image</span></ng-template>
        </ng-container>

        <!-- Edition individuelle : si la cellule est en édition -->
        <ng-container *ngIf="isEditing(row, col.key); else viewCell">
          <input [(ngModel)]="editValue" style="width:110px;max-width:110px;padding:2px 6px;font-size:0.98em;display:inline-block;vertical-align:middle;" />
          <button (click)="saveEdit(row, col.key)" style="background:none;border:none;color:#388e3c;margin-left:4px;cursor:pointer;">
            <i class="ri-check-line"></i>
          </button>
          <button (click)="cancelEdit()" style="background:none;border:none;color:#d32f2f;margin-left:2px;cursor:pointer;">
            <i class="ri-close-line"></i>
          </button>
        </ng-container>
        <ng-template #viewCell>
          <ng-container [ngSwitch]="col.type">
            <ng-container *ngSwitchCase="'button'">
              <ui-button
                [label]="col.buttonLabel || ''"
                [icon]="col.buttonIcon || ''"
                [variant]="col.buttonVariant || 'primary'"
                [customClass]="col.buttonCustomClass || ''"
                [disabled]="col.buttonDisabled ? col.buttonDisabled(row) : false"
                (clicked)="onCellButtonClick(col, row, $event)"
              ></ui-button>
            </ng-container>
            <ng-container *ngSwitchDefault>
              <span *ngIf="!col.render && col.type !== 'image'" [ngClass]="getTextClass(col, row)">
                {{ col.display ? col.display(row) : row[col.key] }}
              </span>
              <span *ngIf="col.render" [innerHTML]="col.render(row)"></span>
            </ng-container>
          </ng-container>
          <!-- Bouton édition supprimé hors colonne Actions -->
        </ng-template>
      </td>
      <td *ngIf="actions.length" style="min-width:80px;padding:0 6px;text-align:center;">
        <div style="display:flex;gap:6px;justify-content:center;align-items:center;">
          <ng-container *ngFor="let act of actions">
            <ng-container *ngIf="(act.show ? act.show(row) : true)">
              <ui-icon-button
                [icon]="act.icon ?? ''"
                [variant]="act.variant ?? 'ghost'"
                [disabled]="act.disabled ?? false"
                [customColor]="act.variant ? undefined : (act.color ?? undefined)"
                [title]="act.title || act.label"
                (clicked)="onAction(act.action, row)">
              </ui-icon-button>
            </ng-container>
          </ng-container>
        </div>
      </td>
    </tr>
  </tbody>
</table>
