<div class="dashboard-container">
  <header class="dashboard-header">
    <h1>Tableau de bord</h1>
       <p class="welcome-message" *ngIf="utilisateurConnecte">
      Bienvenue, <span class="highlight">{{ utilisateurConnecte.prenom }} {{ utilisateurConnecte.nom }}</span>
    </p>
  </header>
  <p class="intro">
    Depuis cet espace, vous pouvez gérer les paiements, déposer des documents et commander des tenues.
  </p>

  <!-- Grille d’actions commune refactorisée -->
  <section class="dashboard-grid" aria-labelledby="actions-titre">
    <h2 id="actions-titre" class="visually-hidden">Actions principales</h2>
    <app-dashboard-card
      icon="ri-wallet-3-line"
      title="Paiements"
      description="Consulte tes cotisations et échéances."
      [badge]="stats.paiementsEnRetard"
      (action)="navigateToPaiements()">
    </app-dashboard-card>
    <app-dashboard-card
      icon="ri-folder-upload-line"
      title="Documents"
      description="Dépose / consulte certificat médical."
      [badge]="stats.documentsManquants"
      (action)="navigateToDocuments()">
    </app-dashboard-card>
    <app-dashboard-card
      icon="ri-shopping-bag-line"
      title="Mes Commandes"
      description="Suivi tenues & accessoires."
      [badge]="stats.commandesEnCours"
      (action)="navigateToCommandes()">
    </app-dashboard-card>
    <app-dashboard-card
      icon="ri-calendar-event-line"
      title="Événements"
      description="Inscription & historique stages."
      [badge]="stats.evenementsAVenir"
      (action)="navigateToEvenements()">
    </app-dashboard-card>
  </section>
</div>
