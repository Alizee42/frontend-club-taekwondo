<div class="dashboard-shell">
  <div class="dash-header">
    <div class="dash-header__panel">
      <i class="ri-shield-user-line"></i>
    </div>
    <div class="dash-header__body">
      <h1 class="dash-header__title">Espace membre</h1>
      <p class="dash-header__sub">Bonjour, <strong>{{ utilisateurConnecte?.prenom || 'Membre' }}</strong> — Voici un resume de votre espace membre.</p>
    </div>
    <a class="dash-header__action" (click)="navigateToSupport()" tabindex="0">
      <i class="ri-customer-service-2-line"></i>
      <span>Support</span>
    </a>
  </div>

  <ui-kpi-grid [cols]="4" aria-label="Indicateurs membre">
    <ui-kpi-card icon="ri-folder-warning-line" label="Documents manquants" [value]="stats.documentsManquants" tone="warning"
      [badge]="stats.documentsManquants > 0 ? 'A traiter' : 'Complet'"
      [badgeTone]="stats.documentsManquants > 0 ? 'warning' : 'success'"></ui-kpi-card>

    <ui-kpi-card icon="ri-wallet-3-line" label="Paiements en retard" [value]="stats.paiementsEnRetard" tone="danger"
      [badge]="stats.paiementsEnRetard > 0 ? 'Urgent' : 'OK'"
      [badgeTone]="stats.paiementsEnRetard > 0 ? 'danger' : 'success'"></ui-kpi-card>

    <ui-kpi-card icon="ri-shopping-bag-line" label="Commandes en cours" [value]="stats.commandesEnCours" tone="primary"
      [badge]="stats.commandesEnCours > 0 ? 'En cours' : 'Calme'"
      [badgeTone]="stats.commandesEnCours > 0 ? 'info' : 'success'"></ui-kpi-card>

    <ui-kpi-card icon="ri-calendar-event-line" label="Evenements a venir" [value]="stats.evenementsAVenir" tone="green"
      badge="Agenda" badgeTone="info"></ui-kpi-card>
  </ui-kpi-grid>

  <nav class="dash-section" aria-label="Raccourcis membre">
    <div class="dash-section__head dash-section__head--blue">
      <i class="ri-flashlight-line"></i>
      <span>Mes services</span>
    </div>
    <div class="dash-section__body">
      <app-dashboard-nav-card
        label="Paiements"
        icon="ri-wallet-3-line"
        badgeVariant="danger"
        [badge]="stats.paiementsEnRetard > 0 ? stats.paiementsEnRetard : null"
        (pressed)="navigateToPaiements()"
      />
      <app-dashboard-nav-card
        label="Documents"
        icon="ri-folder-upload-line"
        badgeVariant="warning"
        [badge]="stats.documentsManquants > 0 ? stats.documentsManquants : null"
        (pressed)="navigateToDocuments()"
      />
      <app-dashboard-nav-card
        label="Commandes"
        icon="ri-shopping-bag-line"
        badgeVariant="neutral"
        [badge]="stats.commandesEnCours > 0 ? stats.commandesEnCours : null"
        (pressed)="navigateToCommandes()"
      />
      <app-dashboard-nav-card
        label="Evenements"
        icon="ri-calendar-event-line"
        badgeVariant="neutral"
        [badge]="stats.evenementsAVenir > 0 ? stats.evenementsAVenir : null"
        (pressed)="navigateToEvenements()"
      />
    </div>
  </nav>

  <section class="profile-panel card">
    <div class="profile-panel__head">
      <i class="ri-user-line"></i>
      <h2>Mes informations</h2>
    </div>
    <div class="profile-list">
      <div class="profile-item">
        <i class="ri-user-3-line"></i>
        <span>{{ utilisateurConnecte?.prenom }} {{ utilisateurConnecte?.nom }}</span>
      </div>
      <div class="profile-item">
        <i class="ri-mail-line"></i>
        <span>{{ utilisateurConnecte?.email }}</span>
      </div>
      <div class="profile-item" *ngIf="utilisateurConnecte?.telephone">
        <i class="ri-phone-line"></i>
        <span>{{ utilisateurConnecte?.telephone }}</span>
      </div>
    </div>
  </section>
</div>
