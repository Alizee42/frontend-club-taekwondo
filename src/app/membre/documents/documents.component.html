<div class="page-shell">
  <app-page-header title="Mes documents" icon="ri-file-text-line"></app-page-header>

  <!-- Barre de progression (une seule ligne, scrollable) -->
  <div class="docs-progress-bar" role="list" aria-label="Statut des documents obligatoires">
    <div class="progress-chip"
         role="listitem"
         *ngFor="let doc of requiredDocuments"
         [ngClass]="{
           'chip-success': getDocumentStatusInfo(doc.type).state === 'validé',
           'chip-warn':    getDocumentStatusInfo(doc.type).state === 'en_attente',
           'chip-danger':  getDocumentStatusInfo(doc.type).state === 'refusé'
         }">
      <i class="ri-check-circle-fill" *ngIf="getDocumentStatusInfo(doc.type).state === 'validé'"     aria-hidden="true"></i>
      <i class="ri-time-fill"          *ngIf="getDocumentStatusInfo(doc.type).state === 'en_attente'"  aria-hidden="true"></i>
      <i class="ri-close-circle-fill"  *ngIf="getDocumentStatusInfo(doc.type).state === 'refusé'"      aria-hidden="true"></i>
      <span>{{ doc.label }}</span>
      <i *ngIf="getDocumentStatusInfo(doc.type).tooltip"
         class="tooltip-icon"
         [title]="getDocumentStatusInfo(doc.type).tooltip!"
         aria-label="Info">i</i>
    </div>
  </div>

  <!-- Card upload -->
  <div class="upload-card">
    <div class="upload-card-header">
      <div class="upload-card-icon">
        <i class="ri-upload-cloud-2-line" aria-hidden="true"></i>
      </div>
      <div>
        <h3>Ajouter un document</h3>
        <p>PDF, PNG ou JPEG · maximum 5 Mo</p>
      </div>
    </div>
    <div class="upload-card-body">
      <form (ngSubmit)="onUploadDocument()" enctype="multipart/form-data" novalidate class="upload-form">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="documentType">Type de document</label>
            <select id="documentType" class="form-select" [(ngModel)]="documentType" name="documentType" required>
              <option *ngFor="let doc of requiredDocuments" [value]="doc.type" [disabled]="doc.uploaded">
                {{ doc.label }}
              </option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="documentFile">Fichier</label>
            <div class="upload-zone">
              <input id="documentFile" type="file"
                     (change)="onFileSelected($event)"
                     accept=".pdf,.png,.jpg,.jpeg" />
            </div>
            <small class="field-error" *ngIf="selectedFile && !isValidFile(selectedFile)">
              Fichier invalide — PNG, JPEG ou PDF, max 5 Mo.
            </small>
          </div>
        </div>
        <div class="form-actions">
          <ui-button
            type="submit"
            variant="primary"
            icon="ri-upload-2-line"
            label="Téléverser"
            [disabled]="!documentType || !selectedFile || !isValidFile(selectedFile)"
          />
        </div>
      </form>
    </div>
  </div>

  <!-- Tableau des documents -->
  <div class="docs-table-section">
    <h3 class="section-title">Documents envoyés</h3>
    <div class="table-wrap">
      <ui-table
        [columns]="tableColumns"
        [data]="rows"
        [actions]="tableActions"
        (actionClick)="onActionTable($event)">
      </ui-table>
    </div>
  </div>
</div>

<ui-modal
  [open]="!!previewing"
  (closed)="closePreview()"
  size="xl"
  [title]="previewing?.nomDocument || 'Aperçu'">
  <ng-container *ngIf="previewing as d">
    <ng-container *ngIf="d.cheminFichier as p">
      <ng-container *ngIf="isPdf(p); else imagePreview">
        <object [data]="getSafeUrl(p)" type="application/pdf" width="100%" height="600px">
          <p>Impossible d'afficher le PDF.
            <a [href]="rawUrl(p)" target="_blank" rel="noopener">Ouvrir dans un onglet</a>.
          </p>
        </object>
      </ng-container>
      <ng-template #imagePreview>
        <img [src]="rawUrl(p)" alt="aperçu document" class="preview-img" />
      </ng-template>
    </ng-container>
    <p *ngIf="!d.cheminFichier" class="muted">Aucun fichier à prévisualiser.</p>
  </ng-container>
</ui-modal>
