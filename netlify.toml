[build]
  command = "ng build --configuration production"
  publish = "dist/club-taekwondo/browser"

# Functions (serverless) config
[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "http://217.160.69.180:8080/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "http://217.160.69.180:8080/uploads/:splat"
  status = 200
  force = true

# Redirection SPA pour Angular
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
